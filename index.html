<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor Moreira — Quiz de 10 Questões por Assunto</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#8100ec,transparent 55%),linear-gradient(135deg,#16004b,#4d007b 55%,#e6006a);color:white;font-family:system-ui,Arial,sans-serif;min-height:100dvh}button{cursor:pointer;font-family:inherit}header{background:#ffe600;color:#2a0057;padding:12px;text-align:center;font-weight:1000;font-size:clamp(18px,3.5vw,28px);border-bottom:5px solid white}.shell{max-width:1150px;margin:auto;padding:12px 12px 110px}.heading{font-size:clamp(27px,5vw,45px);text-align:center;margin:16px 0 8px}.subtitle{text-align:center;font-weight:750;font-size:20px}.panel{background:white;color:#241049;border:5px solid #00dfff;border-radius:24px;padding:clamp(15px,3vw,30px);box-shadow:0 10px 0 #110032}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:22px 0}.tile{background:#fff;color:#320068;border:3px solid #ffe600;border-radius:19px;padding:18px;text-align:left;font-size:21px;font-weight:900;min-height:112px}.tile span{display:block;color:#c0006b;margin-top:8px}.tile.all{background:#ffe600;border-color:#fff}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.toolbar button,.mainbtn{border:2px solid white;border-radius:12px;background:#6700d4;color:white;font-size:17px;font-weight:900;padding:11px 14px}.toolbar .active{background:#ed006f}.toolbar input{width:90px}.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:19px;font-weight:900;color:#7200bd}.source{color:#ad0065;font-size:16px;font-weight:800;margin:10px 0}.stem{font-size:clamp(21px,3vw,29px);line-height:1.48;font-weight:750;white-space:pre-wrap;overflow-wrap:anywhere}.choices{display:grid;gap:11px;margin-top:22px}.choice{display:flex;align-items:flex-start;gap:12px;width:100%;border:3px solid #6600bb;border-radius:15px;background:#f4eaff;color:#24074d;text-align:left;padding:13px;font-size:clamp(19px,2.7vw,25px);font-weight:800;white-space:pre-wrap;overflow-wrap:anywhere}.choice b{background:#6600bd;color:white;border-radius:9px;padding:4px 11px}.choice.selected{background:#dce8ff;border-color:#176aff}.choice.correct{background:#b7ffce;border-color:#009d43}.choice.wrong{background:#ffd5df;border-color:#e00043}.explanation{margin-top:18px;background:#fff3ba;border-left:8px solid #f1b000;border-radius:12px;padding:18px;font-size:clamp(19px,2.7vw,25px);line-height:1.5;white-space:pre-wrap}.feedback{font-size:24px;font-weight:950;margin-top:15px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:7px;justify-content:center;background:#250054;border-top:3px solid #ffe600;padding:9px;z-index:20}.nav button{background:#ffe600;color:#290052;border:2px solid white;border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.5vw,19px);font-weight:1000}.nav button:disabled{opacity:.4}.nav #homeBtn{background:#00dfff;color:#290052}.score{font-size:clamp(26px,4vw,40px);font-weight:950;text-align:center}.small{font-size:18px;color:#655078}.mode{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}.mode button{background:#00dfff;color:#240052;border:3px solid white;border-radius:13px;padding:15px 22px;font-size:23px;font-weight:950}.mode .active{background:#ffe600}.drawarea{position:relative}.drawarea canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none;z-index:5}.drawarea.drawing canvas{pointer-events:auto;cursor:crosshair}table{border-collapse:collapse;max-width:100%;margin:12px 0}td,th{border:2px solid #777;padding:8px}img{max-width:100%}@media(min-width:800px){.choices{grid-template-columns:1fr 1fr}}@media(max-width:500px){.nav button{padding:10px 4px;flex:1;font-size:12px}.shell{padding-bottom:100px}.tile{font-size:19px}}
</style></head><body><header>📚 CURSO DE CONTABILIDADE PROFESSOR MOREIRA</header><div class="shell"><div id="app"></div></div><nav class="nav"><button id="homeBtn" onclick="home()" title="Voltar ao menu inicial" aria-label="Voltar ao menu inicial">🏠 INÍCIO</button><button id="back" onclick="move(-1)">◀ VOLTAR</button><button onclick="restart()">↻ REINICIAR</button><button id="next" onclick="move(1)">AVANÇAR ▶</button></nav><script>
const DATA=[{"group":0,"n":1,"source":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2026","stem":"Em 01/07/2025, uma construtora iniciou a construção de um prédio formado por estúdios de 20 metros quadrados. O prazo estimado para a construção era de 18 meses.\n\nNos primeiros três meses de obra, os gastos diretos, associados à construção, foram de R$ 500.000,00. Em 30/09/2025, um grupo de moradores entrou na Justiça contra a construtora para solicitar a suspensão da obra, já que consideravam que o tipo de apartamento seria prejudicial ao bairro. Além disso, pediam uma indenização de R$ 200.000,00.\n\nNa data, os advogados da construtora julgaram que perda da causa era possível. Ainda, por determinação da justiça, a obra foi suspensa e não havia sido retomada até 31/12/2025.\n\nPor conta do processo, com base na NBC TG 25 (R2) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, no Balanço Patrimonial da construtora, em 31/12/2025,","opts":["houve uma provisão para contingências de R$ 200.000,00.","houve uma provisão para contingências de R$ 500.000,00.","houve uma provisão para contingências de R$ 700.000,00.","não houve impacto nos elementos patrimoniais."],"answer":3,"explanation":"Perda possível não gera provisão: o pedido de indenização de R$ 200.000 é passivo contingente, divulgado se não remoto (itens 27–28 e 86). Os R$ 500.000 são gastos da obra, não valor da obrigação judicial. A suspensão pode exigir avaliação separada de recuperabilidade, mas não cria automaticamente provisão judicial. A alternativa D refere-se ao impacto do processo nos elementos patrimoniais."},{"group":0,"n":2,"source":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2026","stem":"O Departamento jurídico da Empresa Ltda. apresentou parecer acerca dos seguintes casos que envolvem situações jurídicas e fiscais em andamento:\n\n • CASO 1: Autuação Fiscal: Auto de infração recebido do fisco Federal. A probabilidade de perda é avaliada como PROVÁVEL, sendo possível fazer uma estimativa confiável do valor. • CASO 2: Ação Cível: Processo movido por um cliente por danos morais. A probabilidade de perda é classificada como POSSÍVEL. • CASO 3: Processo Trabalhista: Ação judicial movida por um empregado. Os advogados da empresa classificam a perda como REMOTA.\n\nDe acordo com as informações do departamento jurídico da empresa e as determinações da NBC TG 25 (R2) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, assinale a opção correta a respeito da forma como a empresa deve proceder em relação ao reconhecimento contábil e à evidenciação em notas explicativas para os três casos apresentados.","opts":["CASO 1: Reconhecer a provisão no Passivo e divulgar em notas explicativas; CASO 2: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 3: Não reconhecer e nem divulgar em notas explicativas.","CASO 1: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 2: Reconhecer provisão no Passivo; CASO 3: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa.","CASO 1: Não reconhecer e nem divulgar em notas explicativas; CASO 2: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 3: Reconhecer provisão no Passivo.","CASO 1: Reconhecer a provisão no Passivo; CASO 2: Não reconhecer e nem divulgar em notas explicativas; CASO 3: Não reconhecer e nem divulgar em notas explicativas."],"answer":0,"explanation":"Caso 1: obrigação provável e mensurável: reconhecer provisão e divulgar (item 14). Caso 2: perda possível: não reconhecer, mas divulgar passivo contingente (itens 27–28 e 86). Caso 3: perda remota: não reconhecer nem divulgar, salvo circunstâncias excepcionais (item 28)."},{"group":0,"n":3,"source":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"Para que um passivo se qualifique para reconhecimento, é necessário haver não somente uma obrigação presente, mas também a probabilidade de saída de recursos que incorporem benefícios econômicos para liquidar essa obrigação.\n\nNo caso de uma Provisão, o reconhecimento se dá quando:\n\n (a) a entidade tem uma obrigação presente (legal ou não formalizada) como resultado de evento passado; (b) seja provável uma necessária saída de recursos que incorporem benefícios econômicos para liquidar a obrigação; e (c) possa ser feita uma estimativa confiável do valor da obrigação. Se essas condições não forem satisfeitas, nenhuma provisão deve ser reconhecida.\n\nEm relação ao reconhecimento de um PASSIVO CONTINGENTE, de acordo com a NBC TG 25 (R2), é correto afirmar que","opts":["não é reconhecido e nem divulgado em notas explicativas.","não é reconhecido, mas é divulgado em notas explicativas.","é reconhecido e divulgado em notas explicativas.","é reconhecido, mas não é divulgado em notas explicativas."],"answer":1,"explanation":"GABARITO: LETRA B. O passivo contingente não é reconhecido no balanço patrimonial (NBC TG 25, item 27), mas é divulgado em notas explicativas, salvo quando a possibilidade de saída de recursos for remota (itens 28 e 86). Gabarito Letra B."},{"group":0,"n":4,"source":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"De acordo com a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, provisão é um passivo de prazo incerto ou de valor incerto.\n\nConsidere que a sociedade empresária Beta tenha recebido laudo de seu advogado sobre um provável pagamento de processo trabalhista, entretanto com mensuração ainda não confiável.\n\nNesse caso, o seu reconhecimento nas demonstrações financeiras deve ser","opts":["como apropriação por competência no balanço patrimonial.","como provisão trabalhista no balanço patrimonial.","não realizar reconhecimento de provisão trabalhista no balanço patrimonial e não divulgar em nota explicativa.","não realizar reconhecimento de provisão trabalhista no balanço patrimonial, mas divulgar em nota explicativa como passivo contingente."],"answer":3,"explanation":"Embora a perda seja provável, não há mensuração confiável. Faltou um dos três requisitos cumulativos do item 14: obrigação presente, saída provável e estimativa confiável. Não reconhecer provisão; divulgar como passivo contingente, salvo exceção aplicável (itens 26 e 86)."},{"group":0,"n":5,"source":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"De acordo com a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, a entidade deve divulgar, em notas explicativas, para cada classe de passivo contingente na data do balanço, uma breve descrição da natureza do passivo contingente, a menos que a possibilidade de ocorrer qualquer desembolso na liquidação seja","opts":["remota.","possível.","provável.","possível e provável."],"answer":0,"explanation":"O item 86 determina divulgar cada classe de passivo contingente, exceto quando a possibilidade de saída de recursos for remota. Possível é divulgado; provável com obrigação presente e estimativa confiável costuma exigir provisão."},{"group":0,"n":6,"source":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"Em janeiro de 2025, um artista, que possui uma empresa, estava em um evento estratégico em um resort na Bahia. Ao voltar da viagem, descobriu que um influenciador digital, que também estava no evento, divulgou fotos e vídeos do artista em redes sociais.\n\nA empresa do artista entrou na justiça por quebra de privacidade contra o resort e contra o influenciador, pedindo, respectivamente, R$ 10.000,00 e R$ 15.000,00.\n\nOs advogados da empresa do artista julgaram que as chances de ganho das causas eram, respectivamente, remota e possível. Com base no julgamento dos advogados, a empresa deve apresentar, em suas demonstrações contábeis, um ativo contingente","opts":["igual a zero.","de R$ 10.000,00.","de R$ 15.000,00.","de R$ 25.000,00."],"answer":0,"explanation":"Uma ação proposta pela entidade representa potencial entrada de benefícios, isto é, ativo contingente. O item 31 proíbe reconhecer ativo contingente; o item 34 permite divulgação somente quando a entrada for provável. Aqui as chances são remota e possível: nenhum ativo reconhecido, e nenhum valor de ativo contingente no balanço."},{"group":0,"n":7,"source":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2025","stem":"A empresa S.A. possuía, em 31/12/2024, obrigações presentes como resultados de eventos passados cuja saída de recursos envolvendo benefícios futuros na liquidação esteve sujeita à análise, com a classificação disposta na tabela a seguir:\n\n[TABELA_1]\n\nCom base nos dados, seguindo a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, o montante a ser reconhecido como provisões no Balanço Patrimonial da empresa deve ser de","opts":["R$ 20.000,00.","R$ 40.000,00.","R$ 30.000,00.","R$ 50.000,00."],"answer":0,"explanation":"Garantia de venda R$ 5.000 + terreno contaminado com obrigação não formalizada R$ 15.000 = R$ 20.000. Ambas são obrigações presentes, prováveis e mensuráveis. Os processos remoto e possível não entram; o processo fiscal também não é provável nem mensurável (item 14)."},{"group":0,"n":8,"source":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024","stem":"Em janeiro de 2024, Joana adquiriu ingresso para um show musical que aconteceria em 11/02/2024.\n\nO show estava agendado para começar às 18 horas, mas só teve início às 22 horas. Joana precisou sair às 21 horas, de modo que não assistiu ao show.\n\nPor conta do atraso, Joana entrou na justiça contra os organizadores do show, pedindo a devolução do preço do ingresso, que havia custado R$400, e uma indenização por danos morais, de R$1.000.\n\nOs advogados dos organizadores do show julgaram que a necessidade de pagamento decorrente da perda da causa por danos morais era possível, enquanto a perda da causa pela devolução do preço do ingresso, era provável.\n\nAssinale a opção que indica o valor da provisão reconhecida pelos organizadores do show, devido à causa de Joana.","opts":["Zero.","R$400.","R$1.000.","R$1.400."],"answer":1,"explanation":"Devolução do ingresso: R$ 400, perda provável e valor conhecido → provisão. Danos morais: R$ 1.000, perda possível → passivo contingente divulgado, sem reconhecimento. Provisão total = R$ 400 (itens 14, 27 e 28)."},{"group":0,"n":9,"source":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2024","stem":"A NBC TG 25 – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES ilustra o tratamento contábil quando uma obrigação presente ou possível da entidade envolve prazos ou valores incertos.\n\nCom base na referida norma, relacione o tratamento dado a cada situação a seguir com seu reconhecimento e divulgação.\n\n I. Há obrigação presente que provavelmente requer uma saída de recursos.\n\n II. Há obrigação possível ou obrigação presente que pode requerer, mas provavelmente não irá requerer, uma saída de recursos.\n\n III. Há obrigação possível ou obrigação presente cuja probabilidade de uma saída de recursos é remota.\n\n ( ) Não é reconhecida nenhuma provisão e não há obrigatoriedade de divulgação.\n\n ( ) Deve-se reconhecer a provisão e divulgar em nota explicativa.\n\n ( ) Não é reconhecida a provisão, mas é divulgado o fato em nota explicativa como passivo contingente.\n\nA relação correta, na ordem apresentada, é","opts":["III – I – II.","III – II – I.","II – I – III.","I – III – II."],"answer":0,"explanation":"A ordem das descrições é: risco remoto → III (sem reconhecimento nem divulgação); saída provável com obrigação presente e mensuração confiável → I (reconhece e divulga); possível → II (divulga sem reconhecer). Sequência III – I – II."},{"group":0,"n":10,"source":"FGV - Bach (CFC)/CFC/2º Exame de Suficiência/2024","stem":"Um curso de idiomas oferecia aulas de inglês, espanhol e japonês. Em 2024, a gerência do curso resolveu extinguir a oferta de aulas de japonês e espanhol, passando a oferecer apenas aulas de inglês. A reorganização dos cursos teve efeito material na natureza e no foco das operações do curso, de modo que foi constituída uma provisão para reestruturação. Assinale a opção que indica gastos que podem ser incluídos no valor da provisão.","opts":["Novo treinamento da equipe permanente.","Investimento em novos sistemas e redes de distribuição.","Gastos incrementais de marketing relacionado ao curso de inglês.","Indenização aos proprietários das salas onde eram ofertados os cursos e que deixaram de ser utilizadas."],"answer":3,"explanation":"A provisão de reestruturação inclui somente desembolsos diretos necessariamente decorrentes da reestruturação e não associados às atividades contínuas (itens 80–83). Indenização para desocupar salas enquadra-se. Treinamento, novos sistemas e marketing da operação futura não integram."},{"group":0,"n":11,"source":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2023","stem":"O balanço patrimonial de uma sociedade comercial, em 31 de dezembro de 2021, apresentava saldo de R$ 1.300.000,00 na conta Provisão para processos judiciais. A composição dessa conta contábil era a seguinte:\n\n[TABELA_1]\n\nNo encerramento do exercício social, em 31 de dezembro de 2022, os consultores jurídicos realizaram análise detalhada de todos os processos judiciais que envolviam a sociedade comercial, avaliando a probabilidade de desembolso para liquidação das ações judiciais (expectativa de perda) e apresentou o seguinte sumário à administração:\n\n[TABELA_2]\n\nCom base, exclusivamente, nas informações apresentadas, considerando o disposto na NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes, o efeito líquido no resultado da sociedade comercial no exercício findo em 31 de dezembro de 2022, decorrente da contabilização das provisões para processos judiciais, desconsiderando eventuais efeitos fiscais, foi:","opts":["Redução de R$ 150.000,00.","Redução de R$ 170.000,00.","Aumento de R$ 110.000,00.","Aumento de R$ 150.000,00."],"answer":3,"explanation":"Provisão necessária em 2022 = R$ 700.000 (trabalhistas prováveis) + R$ 450.000 (tributários prováveis) = R$ 1.150.000. Saldo anterior R$ 1.300.000. Reversão líquida = R$ 150.000, aumentando o resultado. Os valores possíveis/remotos não entram no passivo reconhecido."},{"group":0,"n":12,"source":"CONSULPLAN - Bach (CFC)/CFC/1º Exame de Suficiência/2022","stem":"Uma indústria comercializa o Produto A e dá garantias contratuais aos clientes no momento da venda desse seu produto. Como política de produção e comercialização já adotada há alguns anos, os clientes estarão cobertos pelo custo da reparação ou até mesmo substituição, caso surjam defeitos no produto em até doze meses a contar da data da venda (evento que cria obrigação). A indústria vem trabalhando para aprimorar todo o processo produtivo do Produto A na busca de minimizar os acionamentos dessas garantias, mas, por meio de levantamento técnico com base em experiências passadas, é provável que alguns clientes acionem as garantias. Apesar do otimismo com a qualidade do seu produto, a indústria considera R$ 80.000,00 uma estimativa confiável a ser utilizada no próximo exercício social para liquidar os custos de garantias para reparação ou substituição, caso sejam detectados defeitos em Produtos A vendidos.\n\nConsiderando-se exclusivamente as informações apresentadas e a NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes, a indústria deverá reconhecer o valor de R$ 80.000,00 como:","opts":["Provisões para Garantias no Ativo Circulante.","Provisões para Garantias no Passivo Circulante.","Perda Estimada com Garantias no Passivo Circulante.","Passivo Contingente em conta redutora no Ativo Circulante."],"answer":1,"explanation":"A venda com garantia contratual é evento passado gerador de obrigação. A saída é provável e R$ 80.000 é estimativa confiável. Reconhece despesa e provisão no passivo circulante, pois os defeitos cobertos surgem até 12 meses da venda (item 14)."},{"group":0,"n":13,"source":"CONSULPLAN - Bach (CFC)/CFC/1º Exame de Suficiência/2022","stem":"Uma companhia aérea foi acionada na Justiça por um passageiro que teve sua bagagem extraviada. Os contadores da companhia aérea julgaram que a perda da causa na Justiça era provável e conseguiam estimar o valor da obrigação de modo confiável. Assinale, a seguir, o tratamento contábil da causa pela contabilidade da companhia aérea.","opts":["Nada deve ser feito.","Evidenciação em nota explicativa, apenas.","Reconhecimento de passivo e de despesa, apenas.","Reconhecimento de passivo e redução de caixa, apenas."],"answer":2,"explanation":"Obrigação presente por litígio, perda provável e valor confiável: débito em despesa e crédito em provisão (passivo). O caixa somente diminui quando a obrigação for efetivamente liquidada. Item 14 da NBC TG 25."},{"group":0,"n":14,"source":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2022","stem":"Por meio de Memorando Conjunto do Departamento Jurídico e do Departamento Tributário, o Departamento de Contabilidade da Cia. Terra Prometida é comunicado de que a entidade acaba de ingressar com ação judicial contra a União, pleiteando créditos tributários cobrados a maior nos últimos cinco anos. O documento informa ainda que, em casos parecidos, não há consenso sobre o efetivo direito das empresas, sendo possível, mas improvável, o desfecho favorável da ação.\n\nDiante da situação descrita, e com base na NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes, o contador da Cia. Terra Prometida:","opts":["Não deve proceder a qualquer registro contábil em contas patrimoniais, nem efetuar qualquer tipo de divulgação em notas explicativas.","Deve registrar em conta de Ativo Diferido o valor das diferenças apuradas pelos outros setores, atualizados monetariamente e corrigidos por juros de mora.","Deve divulgar o fato em notas explicativas sem, no entanto, proceder ao registro de qualquer direito no Balanço Patrimonial, ante a incerteza de fruição de benefícios econômicos futuros.","Deve registrar em conta de Ativo Não Circulante – Realizável a Longo Prazo – Créditos Tributários, o montante provável de realização da ação judicial, em valores nominais, divulgando o fato em notas explicativas"],"answer":0,"explanation":"A empresa é autora da ação, logo a discussão envolve ativo contingente, não passivo. Ganho apenas possível, não provável: não reconhecer (item 31) e não divulgar (item 34). A alternativa A corresponde ao tratamento da banca."},{"group":0,"n":15,"source":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2022","stem":"Em reunião com o departamento de contabilidade, o advogado de determinada empresa informa à chefia responsável, que, no último mês, a empresa foi notificada da existência de três ações judiciais, cujas características são:\n\n I. Ação de natureza trabalhista, ajuizada por ex-funcionário que alega o não recebimento de verbas. O advogado julga provável que será necessário desembolsar, até o encerramento do exercício seguinte, o valor de R$ 15.000,00, baseado em decisões recentes de casos semelhantes.\n\n II. Ação de natureza fiscal, no valor de R$ 9.000,00, ajuizada pela Prefeitura Municipal, que alega erro na base de cálculo do Imposto sobre Serviços recolhido pela empresa no último ano. O advogado afirma ser possível uma saída de recursos, mas não sabe estimar com confiança o prazo de sua ocorrência.\n\n III. Ação de natureza ambiental, movida pela autarquia de água e esgoto do município, que alega descarte irregular de lixo da empresa, e solicita indenização de R$ 14.000,00. O advogado afirma que a probabilidade de saída de recursos em decorrência deste litígio é remota, quase nula.\n\nConsiderando o exposto e com base na NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes, assinale a afirmativa correta.","opts":["O contador deve proceder ao reconhecimento de um passivo exigível de R$ 15.000,00, além de constituir provisão no Passivo Não Circulante no valor de R$ 23.000,00.","As ações judiciais descritas nos itens I, II e III configuram-se como passivos contingentes; portanto, não é necessária qualquer provisão ou divulgação em Notas Explicativas.","O procedimento a ser adotado pelo contador, em conformidade com a Norma citada, é o reconhecimento imediato de provisão no Passivo Circulante, no valor total de R$ 38.000,00.","A ação descrita no item I requer a constituição de uma provisão, no Passivo Circulante, no valor de R$ 15.000,00, enquanto as ações descritas nos itens II e III devem ser consideradas Passivos contingentes e, por isso, não devem ser reconhecidas. Contudo, há a necessidade de divulgação, em Notas Explicativas, da ação descrita no item II."],"answer":3,"explanation":"Item I: R$ 15.000, saída provável e estimável até o exercício seguinte → provisão no passivo circulante. Item II: possível → passivo contingente divulgado, ainda que o prazo seja incerto. Item III: remoto → sem provisão nem divulgação. Itens 14, 27–28 e 86."},{"group":0,"n":16,"source":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2021","stem":"A NBC TG 25 (R1) – Provisões, Passivos Contingentes e Ativos Contingentes estabelece critérios de reconhecimento e bases de mensuração apropriados a provisões e a passivos e ativos contingentes. Diante disso, o contador de uma entidade empresária fez a contabilização da provisão para contingência de cinco processos trabalhistas, com base em seus documentos. Contudo, ele verificou que seria imprescindível consultar o departamento jurídico da entidade sobre quais as probabilidades de perda desses processos.\n\nApós a resposta do departamento jurídico, o contador comparou os seus registros com as informações dos advogados, verificando as seguintes classificações:\n\n[TABELA_1]\n\nDiante de tais informações, o contador constatou que deveria fazer a contabilização com base nas classificações do departamento jurídico, pois os advogados possuem maior conhecimento e experiência sobre o assunto. Nesse sentido, considerando apenas os dados da tabela, assinale o valor total da provisão a ser contabilizado no Balanço Patrimonial.","opts":["R$ 133.000,00","R$ 155.000,00","R$ 250.000,00","R$ 288.000,00"],"answer":1,"explanation":"Adotando as avaliações jurídicas: processo 1 provável R$ 80.000 e processo 2 provável R$ 75.000. Total R$ 155.000. Processo 3 remoto, processo 4 possível e processo 5 remoto não são reconhecidos. O item 14 orienta o reconhecimento."},{"group":0,"n":17,"source":"CONSULPLAN - Bach (CFC)/CFC/1º Exame de Suficiência/2019","stem":"A Sociedade Empresária “A” é do setor de varejo e comercializa suas centenas de produtos com uma garantia segundo a qual os clientes estarão cobertos pelo custo da reparação de qualquer defeito de fabricação que se tornar evidente dentro do primeiro ano após a compra. A experiência passada da Sociedade Empresária “A” e as expectativas futuras indicam que, para o próximo ano, dos seus produtos vendidos, 60% não apresentarão defeitos, 30% apresentarão defeitos menores e 10% apresentarão defeitos maiores.\n\nOutras informações: A Sociedade Empresária “A” irá incorrer:\n\n • Em custos de reparação de R$ 800.000,00, caso sejam detectados defeitos menores em todos os seus produtos vendidos.\n\n • Em custos de reparação de R$ 1.500.000,00, caso sejam detectados defeitos maiores em todos os produtos vendidos.\n\nConsiderando-se apenas as informações apresentadas e a NBC TG 25 (R2) – Provisões, passivos contingentes e ativos contingentes, assinale o valor esperado do custo das reparações que a Sociedade Empresária “A” reconheceria como provisão. Admita que os valores dos custos de reparação, caso sejam detectados defeitos, e as probabilidades associadas aos possíveis desfechos, foram determinados pelo julgamento da Sociedade Empresária “A”, complementado pela experiência de transações semelhantes somado aos relatórios de peritos independentes. Ainda, admita que os critérios para reconhecimento da provisão foram atendidos conforme determina a NBC TG 25 (R2).","opts":["R$ 390.000,00","R$ 530.000,00","R$ 920.000,00","R$ 2.300.000,00"],"answer":0,"explanation":"Valor esperado para grande população (item 39): 60% × R$ 0 + 30% × R$ 800.000 + 10% × R$ 1.500.000 = R$ 240.000 + R$ 150.000 = R$ 390.000. A provisão reflete o valor esperado, não o pior cenário."},{"group":0,"n":18,"source":"CONSULPLAN - Bach (CFC)/CFC/2º Exame de Suficiência/2019","stem":"A Cia Gama foi acionada judicialmente por um antigo empregado, que reclama não ter recebido os valores devidos relativos a férias e pede R$ 20.000,00 da empresa. O advogado da Cia Gama julga que o risco de perda na Justiça é provável.\n\nAssinale o tratamento contábil nesse caso, com base na NBC TG 25 (R2) – Provisões, Passivos Contingentes e Ativos Contingentes.","opts":["Reconhecimento de ativo contingente.","Reconhecimento de passivo contingente.","Reconhecimento de reserva para contingência.","Reconhecimento de provisão para contingência."],"answer":3,"explanation":"Pedido de R$ 20.000 por férias não pagas, perda provável e valor informado. Pressupondo obrigação presente e estimativa confiável, reconhece provisão para litígio, não reserva de patrimônio líquido nem passivo contingente não reconhecido (item 14)."},{"group":0,"n":19,"source":"FBC - Bach (CFC)/CFC/2º Exame de Suficiência/2016","stem":"O Departamento Jurídico de uma Sociedade Empresária forneceu ao Departamento de Contabilidade a relação dos processos em julgamento, conforme tabela a seguir.\n\n[TABELA_1]\n\nConsiderando-se apenas as condições estabelecidas na NBC TG 25 (R1) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES e os dados da tabela apresentada, a Sociedade Empresária irá reconhecer como provisão, na contabilidade:","opts":["os processos relativos a Insalubridade, a Hora Extra, a Danos Materiais e a Discussão da Constitucionalidade da Cofins, que totalizam R$5.520.000,00.","os processos relativos a Insalubridade, a Hora Extra e a Discussão da constitucionalidade da Cofins, que totalizam R$4.820.000,00.","os processos relativos a Hora Extra e a Discussão da Constitucionalidade da Cofins, que totalizam R$3.320.000,00.","os processos relativos a Insalubridade e a Danos Materiais, que totalizam R$2.200.000,00."],"answer":2,"explanation":"Somente causas prováveis e mensuráveis: hora extra R$ 860.000 + Cofins R$ 2.460.000 = R$ 3.320.000. Insalubridade possível divulga-se, sem provisão; danos materiais remotos não geram provisão."},{"group":0,"n":20,"source":"FBC - Bach (CFC)/CFC/2º Exame de Suficiência/2016","stem":"Uma Sociedade Empresária apresentava um saldo de R$350.000,00 em Duplicatas a Receber, em 31.12.2015, antes do encerramento do seu Balanço Patrimonial.\n\nAo proceder a mensuração do valor recuperável dessas duplicatas a receber, a empresa estimou uma perda no valor recuperável de R$10.500,00.\n\nO lançamento contábil da constituição dessa perda estimada será:","opts":["Débito: Perdas Estimadas com Contas a Receber – Despesas Comerciais; Crédito: Perdas Estimadas com Créditos de Liquidação Duvidosa – Clientes; R$ 10.500,00.","Débito: Custo das Mercadorias Vendidas; Crédito: Perdas Estimadas com Créditos de Liquidação Duvidosa – Clientes; R$ 10.500,00.","Débito: Perdas Estimadas com Contas a Receber – Despesas Comerciais; Crédito: Duplicatas a Receber – Clientes; R$ 10.500,00.","Débito: Custo das Mercadorias Vendidas; Crédito: Duplicatas a Receber – Clientes; R$ 10.500,00."],"answer":0,"explanation":"Esta questão é sobre perda esperada em créditos a receber, e não sobre provisão para obrigação segundo o CPC 25. O lançamento correto debita despesa com perdas estimadas em contas a receber e credita conta redutora do ativo (perdas estimadas com créditos de liquidação duvidosa), R$ 10.500. A conta Duplicatas a Receber não é baixada diretamente neste reconhecimento."},{"group":0,"n":21,"source":"FBC - Bach (CFC)/CFC/2º Exame de Suficiência/2015","stem":"Acerca da NBC TG 25 (R1) – Provisões, Passivos Contingentes e Ativos Contingentes, julgue os itens abaixo e, em seguida, assinale a opção CORRETA.\n\n I. Presumindo-se que possa ser feita uma estimativa confiável, as provisões são reconhecidas como passivo porque são obrigações presentes, e é provável que uma saída de recursos que incorporam benefícios econômicos seja necessária para liquidar a obrigação.\n\n II. Passivos Contingentes não são reconhecidos como passivo porque são obrigações possíveis, visto que ainda há de ser confirmado se a entidade tem, ou não, uma obrigação presente que possa conduzir a uma saída de recursos que incorporam benefícios econômicos ou obrigações presentes que não satisfazem aos critérios de reconhecimento da NBC TG 25 (R1).\n\n III. Os Ativos Contingentes são reconhecidos nas demonstrações contábeis, pois tratam-se de resultados que virão a ser realizados.\n\nEstão CORRETOS os itens:","opts":["I e II, apenas.","I e III, apenas.","I, II e III.","II e III, apenas."],"answer":0,"explanation":"I correta: obrigação presente + saída provável + mensuração confiável. II correta: passivo contingente é obrigação possível ou obrigação presente sem os critérios de reconhecimento. III falsa: ativo contingente não é reconhecido, para evitar reconhecer receita incerta (itens 14, 27 e 31)."},{"group":0,"n":22,"source":"FBC - Tec Cont (CFC)/CFC/1º Exame de Suficiência/2014","stem":"A respeito dos critérios de reconhecimento de provisões, conforme o estabelecido na NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes, julgue as situações hipotéticas apresentadas nos itens abaixo e, em seguida, assinale a opção CORRETA.\n\n I. Uma entidade do setor de petróleo causa contaminação e opera em um país onde não há legislação ambiental. Entretanto, a entidade possui uma política ambiental amplamente divulgada, na qual ela assume a limpeza de toda a contaminação que causa. A entidade tem um histórico de honrar essa política publicada e é possível estimar, confiavelmente, os gastos com a limpeza de toda a contaminação causada.\n\n II. Em 12 de dezembro de 2013, o conselho da entidade decidiu encerrar as atividades de uma divisão. Os gastos com o encerramento das atividades foram estimados em R$1.000.000,00, e esta estimativa é confiável. Antes do fechamento do balanço de 31 de dezembro de 2013, a decisão não havia sido comunicada a qualquer um dos afetados por ela e nenhuma outra providência havia sido tomada para implementar a decisão.\n\n III. Uma loja de varejo tem a política de reembolsar compras de clientes insatisfeitos, mesmo que não haja obrigação legal para isso. Sua política de efetuar reembolso é amplamente conhecida. Com base no histórico anterior, é possível mensurar, confiavelmente, o montante dos reembolsos a serem efetuados.\n\nDevem ser objeto de constituição de provisão as situações apresentadas nos itens:","opts":["I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"answer":1,"explanation":"I: política pública de reparar danos e histórico de cumprimento criam obrigação não formalizada; reconhecer se saída provável. II: decisão interna não comunicada nem implementada não cria expectativa válida nos afetados; sem provisão (itens 72–75). III: política conhecida de reembolso cria obrigação não formalizada. Portanto I e III."},{"group":0,"n":23,"source":"FBC - Bach (CFC)/CFC/1º Exame de Suficiência/2014","stem":"Uma sociedade empresária usa o método estatístico de estimativa do Valor Esperado para calcular o montante da provisão para garantias, de acordo com a NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes. Os valores de gastos com garantia previstos e respectivas probabilidades associadas são:\n\n[TABELA_1]\n\nCom base nos dados informados, o valor da provisão para garantias a ser constituída é de:","opts":["R$760.000,00.","R$960.000,00.","R$4.000.000,00.","R$4.800.000,00."],"answer":1,"explanation":"Valor esperado = 60% × 0 + 38% × R$ 2.000.000 + 2% × R$ 10.000.000 = R$ 760.000 + R$ 200.000 = R$ 960.000. Método adequado a grande população de itens, item 39."},{"group":0,"n":24,"source":"FBC - Bach (CFC)/CFC/1º Exame de Suficiência/2013","stem":"De acordo com a NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes, analise os requisitos abaixo em relação ao reconhecimento de uma provisão.\n\n I. Uma provisão deve ser reconhecida quando a entidade tem uma obrigação presente, legal ou não formalizada, como resultado de evento passado.\n\n II. Uma provisão deve ser reconhecida quando seja provável, que será necessária, uma saída de recursos que incorporam benefícios econômicos para liquidar a obrigação.\n\n III. Uma provisão deve ser reconhecida quando possa ser feita uma estimativa confiável do valor da obrigação.\n\nSão requisitos necessários para o reconhecimento de uma provisão o(s) item(ns):","opts":["I e II, apenas.","II e III, apenas.","III, apenas.","I, II e III."],"answer":3,"explanation":"Os três requisitos são cumulativos, conforme item 14: obrigação presente resultante de evento passado; saída de recursos provável; e estimativa confiável. A falta de qualquer requisito impede reconhecer provisão."},{"group":0,"n":25,"source":"FBC - Bach (CFC)/CFC/1º Exame de Suficiência/2013","stem":"Uma sociedade empresária reconhece uma provisão para garantias concedidas aos clientes, no mesmo período em que são registradas as vendas. Apesar de não ser possível prever o valor exato a ser gasto no futuro, com cada cliente, a provisão é constituída e o valor da provisão é calculado com base nas melhores estimativas disponíveis, e em bases confiáveis.\n\nJustificam o procedimento adotado pela empresa os Princípios:","opts":["da Relevância e do Registro pelo Valor Original.","da Prudência e do Custo Histórico.","da Oportunidade e da Competência.","da Continuidade e da Objetividade."],"answer":2,"explanation":"Garantias relacionadas a vendas são reconhecidas no período em que ocorre o evento que gera obrigação, ainda que o desembolso venha depois. Isso expressa competência e tempestividade/oportunidade na terminologia histórica da questão. O valor é estimado com base confiável, conforme CPC 25."},{"group":0,"n":26,"source":"FBC - Tec Cont (CFC)/CFC/2º Exame de Suficiência/2013","stem":"A respeito do Ativo Contingente, conforme a NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes, assinale a opção INCORRETA.","opts":["A entidade não deve reconhecer um ativo contingente.","O ativo contingente é divulgado em notas explicativas quando for provável a entrada de benefícios econômicos.","Os ativos contingentes não são reconhecidos nas demonstrações contábeis, uma vez que pode tratar-se de resultado que nunca venha a ser realizado. Porém, quando a realização do ganho é praticamente certa, então o ativo relacionado não é um ativo contingente e o seu reconhecimento é adequado.","Os ativos contingentes surgem normalmente de evento planejado ou de outros esperados que deem origem à probabilidade de entrada de benefícios econômicos para a entidade."],"answer":3,"explanation":"A alternativa incorreta é D: ativos contingentes normalmente decorrem de eventos não planejados ou não esperados que geram possibilidade de entrada de benefícios (item 32), não de eventos planejados. As alternativas A, B e C refletem os itens 31, 34 e 33."},{"group":0,"n":27,"source":"FBC - Bach (CFC)/CFC/1º Exame de Suficiência/2012","stem":"De acordo com a NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes, quando a provisão a ser mensurada envolve uma grande população de itens, a obrigação pode ser estimada utilizando o método estatístico de estimativa denominado valor esperado.\n\nUma sociedade empresária vende bens com uma garantia segundo a qual os clientes estão cobertos pelo custo da reparação de qualquer defeito de fabricação que se tornar evidente, dentro dos primeiros seis meses, após a compra. Se forem detectados defeitos menores em todos os produtos vendidos, a entidade irá incorrer em custos de reparação de R$1.000.000,00. Se forem detectados defeitos maiores em todos os produtos vendidos, a entidade irá incorrer em custos de reparação de R$4.000.000,00. A experiência passada da entidade e as expectativas futuras indicam que, para o próximo ano, 75% dos bens vendidos não terão defeito, 20% dos bens vendidos terão defeitos menores e 5% dos bens vendidos terão defeitos maiores.\n\nO valor da provisão a ser constituída utilizando o Método Estatístico de Estimativa pelo Valor Esperado é de:","opts":["R$400.000,00.","R$1.250.000,00.","R$1.600.000,00.","R$5.000.000,00."],"answer":0,"explanation":"Valor esperado = 75% × R$ 0 + 20% × R$ 1.000.000 + 5% × R$ 4.000.000 = R$ 200.000 + R$ 200.000 = R$ 400.000. Item 39."},{"group":0,"n":28,"source":"FBC - Bach (CFC)/CFC/2º Exame de Suficiência/2012","stem":"No encerramento do Balanço de 2011 de uma sociedade empresária, foi constatada a ausência de registro de uma despesa financeira referente ao exercício de 2010, no montante de R$30.000,00. Na mesma data, verificou-se que uma provisão para questões judiciais registrada em 2010 por R$12.000,00 deveria ser revertida, uma vez que novos fatos ocorridos em 2011 levaram a equipe jurídica a avaliar como remota a possibilidade de a empresa vir a perder a questão.\n\nO registro contábil das duas situações irá provocar um impacto no resultado de 2011 de:","opts":["R$12.000,00.","R$18.000,00.","R$30.000,00.","R$42.000,00."],"answer":0,"explanation":"Despesa de 2010 omitida deve ser tratada como erro de período anterior, conforme CPC 23, sem afetar o resultado de 2011 na hipótese da prova. A reversão de provisão judicial de R$ 12.000, diante de risco agora remoto, aumenta o resultado de 2011 em R$ 12.000 (item 59 do CPC 25)."},{"group":0,"n":29,"source":"FBC - Tec Cont (CFC)/CFC/1º Exame de Suficiência/2011","stem":"Relacione a situação descrita na primeira coluna com o procedimento a ser adotado na segunda coluna e, em seguida, assinale a opção CORRETA.\n\nA sequência CORRETA é:\n\n(1) Há obrigação presente que, provavelmente, requer uma saída de recursos. (2) Há obrigação possível ou obrigação presente que pode requerer, mas provavelmente não irá requerer uma saída de recursos. (3) Há obrigação possível ou obrigação presente cuja probabilidade de uma saída de recursos é remota.\n\n( ) Nenhuma provisão é reconhecida, mas é exigida divulgação para o passivo contingente. ( ) Nenhuma provisão é reconhecida e nenhuma divulgação é exigida. ( ) A provisão é reconhecida e é exigida divulgação para a provisão.","opts":["2, 3, 1.","1, 3, 2.","2, 1, 3.","1, 2, 3."],"answer":0,"explanation":"A sequência é 2, 3, 1. Situação 2: obrigação possível, saída não provável → não reconhecer e divulgar. Situação 3: risco remoto → não reconhecer nem divulgar. Situação 1: obrigação presente, saída provável e estimativa confiável → reconhecer provisão e divulgar."},{"group":0,"n":30,"source":"FBC - Bach (CFC)/CFC/2º Exame de Suficiência/2011","stem":"Uma sociedade empresária apresentou o seguinte quadro, construído a partir da identificação de diversas obrigações presentes decorrentes de eventos passados, cujas probabilidades de saída de recurso foram classificadas como prováveis ou possíveis.\n\n[TABELA_1]\n\nDe acordo com a NBC TG 25 – Provisões, Passivos Contingentes e Ativos Contingentes, o valor de provisões a ser constituído e apresentado no Balanço Patrimonial será de:","opts":["R$400.000,00.","R$850.000,00.","R$860.000,00.","R$1.250.000,00."],"answer":1,"explanation":"Provisões: garantias R$ 150.000 (provável e confiável) + riscos fiscais/trabalhistas/cíveis R$ 700.000 (provável e confiável) = R$ 850.000. Danos ambientais prováveis sem estimativa confiável não são reconhecidos; demais obrigações possíveis são contingentes divulgáveis (itens 14, 26 e 86)."},{"group":1,"n":1,"source":"FGV - Aud (CAGE RS)/SEFAZ RS/2025","stem":"Uma sociedade empresária exerce a atividade de arrendamento de imóveis a terceiros. Em 31/12/2024, ela atuou como arrendadora e realizou um arrendamento operacional de um prédio de quatro andares a uma escola em um contrato de dois anos. O prédio estava avaliado no Balanço Patrimonial da sociedade empresária por R$ 800.000. O aluguel mensal era de R$ 10.000. O primeiro andar da escola era destinado à secretaria e a atendimentos e o restante era destinado às aulas. Assinale a opção que indica a classificação do prédio no Balanço Patrimonial da sociedade empresária em 31/12/2024:","opts":["R$ 60.000 em ativo imobilizado e R$ 180.000 em propriedade para investimentos.","R$ 200.000 em ativo imobilizado e R$ 600.000 em propriedade para investimentos.","R$ 240.000 em propriedade para investimentos.","R$ 800.000 em ativo imobilizado.","R$ 800.000 em propriedade para investimentos."],"answer":3,"explanation":"Quando o arrendamento de imóveis é a atividade principal da empresa, estes imóveis são utilizados na sua atividade operacional, representando os meios pelos quais a empresa gera receitas em sua operação normal. Esses ativos estão diretamente relacionados à sua atividade-fim e, portanto, devem ser classificados como ativo imobilizado.\n\nA propriedade para investimento, por outro lado, seria aplicável quando uma empresa mantém imóveis para gerar renda secundária, não relacionada à sua atividade principal. Por exemplo, uma indústria que possui um imóvel e o aluga para terceiros.\n\nPortanto, sendo o arrendamento de imóveis a atividade principal da sociedade empresária em questão, o prédio avaliado em R$ 800.000 deve ser classificado integralmente como ativo imobilizado no Balanço Patrimonial em 31/12/2024."},{"group":1,"n":2,"source":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"Em 01/09/2024, uma sociedade empresária localizada em Belo Horizonte adquiriu aparelhos de informática de Manaus por R$ 40.000,00. O frete para a entrega por caminhão era de R$ 2.000,00. No entanto, para receber os aparelhos mais rápido, a sociedade empresária solicitou a entrega por avião e pagou o valor de R$ 5.500,00 pelo frete. A instalação dos aparelhos no escritório custou R$ 1.000,00. Ainda, foram gastos R$ 2.000,00 com testes para verificar se os aparelhos estavam funcionando corretamente. O valor dos aparelhos de informática a serem registrados no ativo imobilizado da sociedade empresária é de","opts":["R$ 43.000,00.","R$ 45.000,00.","R$ 46.500,00.","R$ 48.500,00."],"answer":3,"explanation":"O CPC 27, itens 16 e 17, determina que integram o custo o preço de compra e os gastos diretamente necessários para deixar o bem disponível para o uso pretendido. Preço dos aparelhos: R$ 40.000; frete aéreo efetivamente contratado: R$ 5.500; instalação: R$ 1.000; testes: R$ 2.000. Soma: 40.000 + 5.500 + 1.000 + 2.000 = R$ 48.500. O frete rodoviário de R$ 2.000 era apenas uma opção não utilizada; por isso não entra. Alternativa D."},{"group":1,"n":3,"source":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"Em fevereiro de 2025, um hotel adquiriu um televisor de 98 polegadas para que os seus hospedes assistissem a cerimônia do Oscar, em março. O preço do televisor era de R$ 40.000,00. Na data da compra foi acordado com o fornecedor que o pagamento seria realizado por Pix e, em decorrência, o hotel obteve uma redução de 5% sobre o preço original. Assinale a opção que indica a contrapartida da diminuição de R$ 38.000,00 na conta “Disponibilidades”, nas demonstrações contábeis do hotel.","opts":["Ativo imobilizado de R$ 38.000,00.","Ativo imobilizado de R$ 40.000,00 e receita financeira de R$ 2.000,00.","Ativo imobilizado de R$ 40.000,00 e outras receitas de R$ 2.000,00.","Ativo imobilizado de R$ 40.000,00 e retificação do ativo imobilizado de R$ 2.000,00."],"answer":0,"explanation":"O desconto de 5% foi concedido no próprio preço de aquisição em razão da forma de pagamento. CPC 27, item 16(a): descontos comerciais e abatimentos reduzem o custo inicial. Cálculo: 40.000 × 5% = R$ 2.000; valor efetivamente pago = 40.000 − 2.000 = R$ 38.000. Lançamento: débito em Imobilizado R$ 38.000 e crédito em Disponibilidades R$ 38.000. Não há receita financeira separada nessa operação. Alternativa A."},{"group":1,"n":4,"source":"FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025","stem":"Uma empresa adquiriu uma máquina e registrou na contabilidade os seguintes dispêndios: • Preço de aquisição: R$ 500.000,00; • Imposto de importação: R$ 50.000,00 (não recuperável); • Preparação do local: R$ 100.000,00; • Custo com materiais consumido na realização de testes de funcionamento: R$ 50.000,00; • Honorários dos técnicos que realizaram os testes: R$ 60.000,00; • Vida útil estimada: 10 anos; • Valor residual: R$ 100.000,00. De acordo com a NBC TG 27 (R4) - ATIVO IMOBILIZADO, o custo da máquina, ou seja, o valor contábil de registro inicial desse imobilizado, será de","opts":["R$ 500.000,00.","R$ 550.000,00.","R$ 650.000,00.","R$ 760.000,00."],"answer":3,"explanation":"Para o reconhecimento inicial, some os custos diretamente atribuíveis à máquina (CPC 27, itens 16 e 17): aquisição 500.000 + imposto de importação não recuperável 50.000 + preparação do local 100.000 + materiais de testes 50.000 + técnicos de testes 60.000 = R$ 760.000. Vida útil e valor residual não reduzem o custo de entrada; serão considerados no cálculo da depreciação futura. Alternativa D."},{"group":1,"n":5,"source":"FGV - Ana CI (Pref Canaã Carajás)/Pref Canaã Carajás/2025","stem":"Uma entidade deprecia os seus ativos imobilizados com base no método da linha reta. Em 01/01/2022, a entidade adquiriu de terceiros um veículo usado, fabricado em 2020, por R$40.000 para ser utilizado no deslocamento de seus empregados. Na data, a entidade esperava utilizar o veículo por cinco anos e vende-lo por R$10.000. Em 31/01/2024, a entidade vendeu o veículo por R$35.000. Assinale a opção que indica o resultado obtido com a venda.","opts":["R$3.929,00.","R$7.500,00.","R$11.667,00.","R$13.929,00.","R$17.500,00."],"answer":1,"explanation":"Valor depreciável = custo − valor residual = 40.000 − 10.000 = R$ 30.000. Depreciação anual linear = 30.000/5 = R$ 6.000; mensal = R$ 500. De 01/01/2022 até a venda em 31/01/2024, são 25 meses: depreciação acumulada = 25 × 500 = R$ 12.500. Valor contábil líquido = 40.000 − 12.500 = R$ 27.500. Resultado da venda = 35.000 − 27.500 = R$ 7.500 de ganho. Alternativa B."},{"group":1,"n":6,"source":"FGV - AJ TRT24/TRT 24/Administrativa/Contabilidade/2025","stem":"Uma sociedade empresária do setor de engenharia tem uma biblioteca, que é utilizada por seus empregados para obter informações técnicas. Os livros da biblioteca são classificados no balanço patrimonial da sociedade empresária como","opts":["ativo intangível.","Investimentos.","ativo Imobilizado.","ativo circulante.","ativo realizável a longo prazo."],"answer":2,"explanation":"Os livros físicos compõem uma biblioteca técnica usada por empregados em atividades de engenharia por mais de um período. São bens corpóreos mantidos para suporte à prestação de serviços, enquadrados na definição de imobilizado do CPC 27, item 6. Não são intangíveis, pois possuem substância física, nem estoques destinados à revenda. Alternativa C."},{"group":1,"n":7,"source":"FGV - Per Cont (CFC)/CFC/2025","stem":"Uma empresa S.A. desembolsou os seguintes valores para a construção de uma mineradora: preparação do local de R$ 40.000,00; montante de caixa total dispendido para a construção de R$ 200.000,00. Ainda, era necessário obter uma licença governamental para construir a mineradora. Havia uma condição na licença de que, no final da vida útil esperada da mineradora, o proprietário a desmontasse, removesse quaisquer detritos e restaurasse o terreno à sua condição anterior. Essas condições seriam qualificadas como uma obrigação presente resultante de um acontecimento passado e que provavelmente resultará numa futura saída de recursos no valor presente de R$ 80.000,00. Os custos administrativos foram de R$ 20.000,00 e os outros custos indiretos foram de R$ 10.000,00. Considerando-se as informações apresentadas e os preceitos da NBC TG 25 (R2) e da NBC TG 27, um perito contábil, ao analisar a situação, identificou que a empresa contabilizou corretamente um custo para o imobilizado da mineradora de","opts":["R$ 240.000,00.","R$ 270.000,00.","R$ 320.000,00.","R$ 240.000,00 e uma perda de R$ 80.000,00 no resultado devido à provisão.","R$ 270.000,00 e uma perda de R$ 80.000,00 no resultado devido à provisão."],"answer":2,"explanation":"O CPC 27 inclui no custo de um ativo os gastos necessários à construção e a estimativa inicial da obrigação de desmontagem e recuperação do local, desde que reconhecível como provisão (CPC 25). Cálculo: preparação 40.000 + construção 200.000 + valor presente da restauração 80.000 = R$ 320.000. Custos administrativos gerais de R$ 20.000 e indiretos não atribuíveis de R$ 10.000 ficam fora. A contrapartida dos R$ 80.000 é uma provisão no passivo, não despesa imediata. Alternativa C."},{"group":1,"n":8,"source":"FGV - Per Cont (CFC)/CFC/2025","stem":"Durante um processo de avaliação patrimonial, um perito contábil foi contratado para revisar os registros contábeis de uma empresa S.A. do setor industrial, que decidiu desativar uma fábrica devido à adoção de novas tecnologias mais sustentáveis. Com isso, o valor residual de suas máquinas foi reduzido e a vida útil encurtada, pois a desmobilização antecipada inviabilizou seu uso futuro. Inicialmente, em 01/01/20x3 o ativo – fábrica foi contabilizado no valor de R$ 1.000,00 com depreciação pelo método linear de vida útil de 10 anos e valor residual no valor de R$ 100,00. Em 01/01/20x5, a vida útil foi reduzida para cinco anos e o valor residual para zero. Considerando-se as informações apresentadas e os preceitos da NBC TG 23 e NBC TG 27, o perito contábil analisou a adequação da contabilização da depreciação a partir de 01/01/20X5 e verificou que a nova depreciação anual pelo método linear deve ser de","opts":["R$ 160,00 e a alteração deve ser contabilizada como mudança de política contábil.","R$ 160,00 e a alteração deve ser contabilizada como mudança de estimativa contábil.","R$ 164,00 e a alteração deve ser contabilizada como mudança de política contábil.","R$ 164,00 e a alteração deve ser contabilizada como mudança de estimativa contábil.","R$ 180,00 e a alteração deve ser contabilizada como mudança de política contábil."],"answer":3,"explanation":"Depreciação original: (1.000 − 100)/10 = R$ 90 por ano. Em 01/01/X5, após dois anos completos, a depreciação acumulada é R$ 180 e o valor contábil é R$ 820. O novo valor residual é zero. Se os cinco anos indicados forem a nova vida útil REMANESCENTE, a nova quota é 820/5 = R$ 164 ao ano, alternativa D, mudança de estimativa contábil (CPC 23). Se cinco anos significarem vida útil TOTAL desde X3, restariam três anos, e o resultado seria diferente. O gabarito pressupõe cinco anos remanescentes; explicitar essa interpretação em aula."},{"group":1,"n":9,"source":"FGV - Ana GM (Pref SJC)/Pref SJC/Ciências Contábeis/2025","stem":"Uma concessionária oferecia serviços de aluguel e de venda de carros. As receitas obtidas com cada tipo de serviço correspondiam à metade do faturamento da concessionária. Em 31/12/2024, os carros destinados à venda, com expectativa de negociação no curto prazo, tinham valor contábil de R$ 300.000,00, enquanto os carros destinados ao aluguel tinham valor contábil de R$ 200.000,00. A apresentação dos carros no balanço patrimonial da concessionária em 31/12/2024 é:","opts":["ativo circulante: R$ 500.000,00.","ativo imobilizado: R$ 500.000,00.","ativo circulante: R$ 300.000,00; investimentos: R$ 200.000,00.","ativo imobilizado: R$ 300.000,00; investimentos: R$ 200.000,00.","ativo circulante: R$ 300.000,00; ativo imobilizado: R$ 200.000,00."],"answer":4,"explanation":"Os carros disponíveis para venda no curso normal da atividade são estoques, classificados no ativo circulante (CPC 16): R$ 300.000. Os carros destinados à locação, usados na prestação continuada de serviços, são imobilizado (CPC 27): R$ 200.000. O fato de cada linha gerar metade da receita não altera a classificação dos veículos. Alternativa E."},{"group":1,"n":10,"source":"FGV - AL (CAM DEP)/CAM DEP/Consultor Legislativo/Área IV/2025","stem":"Um escritório de contabilidade adquiriu, em 01/07/2018, móveis para utilizar em suas salas de reunião por R$ 20.000. Na data, estimou-se vida útil de 10 anos. No entanto, em 31/12/2022, o escritório passou a atender seus clientes somente à distância. Deste modo, resolveu fazer uma permuta de seus móveis por computadores, que pertenciam a outro escritório. Na data, o valor justo dos móveis era de R$ 12.000. Já os computadores apresentavam valor contábil de R$ 10.000. Após a realização da permuta, em 31/12/2022, e considerando que a transação tem natureza comercial, os computadores devem ser apresentados no Balanço Patrimonial do escritório de contabilidade por:","opts":["R$ 10.000.","R$ 10.500.","R$ 11.000,","R$ 12.000,","R$ 20.000,"],"answer":3,"explanation":"Em permuta com substância comercial, o CPC 27, item 24, em regra determina mensuração pelo valor justo, salvo exceções de mensuração confiável. O valor justo dos móveis entregues é R$ 12.000; esse valor fundamenta o custo dos computadores recebidos. O valor contábil de R$ 10.000 informado para os computadores no outro escritório não determina a mensuração do adquirente. Alternativa D."},{"group":2,"n":1,"source":"FGV — ADTND (AMAZUL) / Auditor / 2026","stem":"No âmbito da Contabilidade, as contas a receber representam direitos que a entidade possui em relação a terceiros, decorrentes de transações cujo recebimento ocorrerá futuramente. Esses direitos podem surgir, por exemplo, de vendas a prazo, de valores depositados em instituições financeiras ou de outros contratos que asseguram o recebimento de recursos.\n\nConsiderando o conceito de contas a receber, assinale a opção que apresenta corretamente um exemplo dessa categoria contábil.","opts":["Equipamentos adquiridos para uso operacional da empresa.","Duplicatas emitidas em razão de vendas a prazo realizadas pela entidade.","Obrigações assumidas pela empresa com fornecedores de mercadorias.","Gastos antecipados relacionados a seguros contratados para exercícios futuros.","Investimentos mantidos para obtenção de controle societário em outras empresas."],"answer":1,"explanation":"As duplicatas decorrentes de vendas a prazo representam direitos da entidade contra seus clientes e, por isso, são contas a receber."},{"group":2,"n":2,"source":"FGV — ADTND (AMAZUL) / Contador / 2026","stem":"Assinale a opção que indica uma conta de natureza credora, que é incluída no ativo, no Balanço Patrimonial de uma entidade.","opts":["Ações em tesouraria.","Despesa de depreciação.","Reserva para contingências.","Provisão para contingências.","Ajuste a valor presente de um recebível."],"answer":4,"explanation":"O ajuste a valor presente de um recebível é conta retificadora do ativo. Por reduzir o recebível, apresenta natureza credora."},{"group":2,"n":3,"source":"FGV — Of Inv Pol (PC PI) / 2026","stem":"Na elaboração de um laudo relacionado à situação financeira de uma entidade em 31/12/2024, foi constatado que as suas obrigações com terceiros eram de R$ 30.000 e que estas deveriam ser pagas em até 9 meses.\n\nEm relação ao Balanço Patrimonial da entidade, tinha saldo de R$ 30.000 o grupo denominado:","opts":["Ativo circulante.","Passivo circulante.","Patrimônio líquido.","Ativo não circulante.","Passivo não circulante."],"answer":1,"explanation":"Obrigações com terceiros exigíveis em até 9 meses são classificadas no passivo circulante."},{"group":2,"n":4,"source":"FGV — TDTND (AMAZUL) / Técnico em Contabilidade / 2026","stem":"Em 31/12/2025, uma sociedade empresária apresentou, em seu Balanço Patrimonial, passivo não circulante de R$ 45.000.\n\nIsso significa que a sociedade empresária deverá liquidar esse passivo:","opts":["No ano de 2026.","No ano de 2027.","Em qualquer data após 31/12/2026.","Em qualquer data após 31/12/2027.","Não é possível determinar a data de liquidação através da classificação contábil."],"answer":2,"explanation":"Na data-base de 31/12/2025, as obrigações exigíveis após o término do exercício seguinte, isto é, após 31/12/2026, integram o passivo não circulante."},{"group":2,"n":5,"source":"FGV — TDTND (AMAZUL) / Técnico em Contabilidade / 2026","stem":"Assinale a opção que indica duas contas do ativo que podem ser classificadas como circulante ou realizável a longo prazo, de acordo com a expectativa do prazo de realização.","opts":["Clientes e estoques.","Clientes e fornecedores.","Fornecedores e impostos a pagar.","Estoques e depreciação acumulada.","Computadores e depreciação acumulada."],"answer":0,"explanation":"Clientes e estoques são ativos. Conforme o prazo esperado de realização, podem integrar o ativo circulante ou o realizável a longo prazo."},{"group":2,"n":6,"source":"FGV — TDTND (AMAZUL) / Técnico em Contabilidade / 2026","stem":"Em 01/10/2025, uma sociedade empresária aplicou R$ 40.000 em um fundo de investimento, cujo prazo de resgate é de 5 anos.\n\nNo Balanço Patrimonial, a contrapartida da diminuição no caixa deve ser reconhecida no seguinte grupo:","opts":["Investimentos.","Ativo circulante.","Passivo circulante.","Passivo não circulante.","Ativo realizável a longo prazo."],"answer":4,"explanation":"Como o resgate ocorrerá em 5 anos, o direito financeiro será realizado no longo prazo e deve ser classificado no ativo realizável a longo prazo."},{"group":2,"n":7,"source":"FGV — Aud SC (TCE RR) / 2025","stem":"Assinale a opção que indica um investimento e uma despesa cujo reconhecimento é diretamente relacionado a ele.","opts":["Compra de veículo e depreciação.","Arrendamento de edificação e exaustão.","Pesquisa de ativo intangível e amortização.","Contratação de empregado e salário mensal.","Venda de participação acionária e distribuição de dividendos."],"answer":0,"explanation":"A compra do veículo reconhece um ativo imobilizado. A depreciação apropria como despesa a perda de valor desse ativo ao longo de sua vida útil."},{"group":2,"n":8,"source":"FGV — ACE (TCE RR) / Ciências Contábeis / 2025","stem":"Das contas a seguir, a que pode ser classificada como ativo circulante ou realizável a longo prazo, dependendo do prazo de realização é:","opts":["Disponibilidades.","Ativo contingente.","Estoques.","Receita antecipada.","Adiantamento a diretores."],"answer":2,"explanation":"Os estoques podem ser classificados no circulante ou no realizável a longo prazo conforme o ciclo operacional e o prazo esperado de realização."},{"group":2,"n":9,"source":"FGV — Bacharel (CFC) / 1º Exame de Suficiência / 2025","stem":"Assinale a opção que contempla apenas componentes do Patrimônio Líquido, descritos na Lei nº 6.404/76 e alterações posteriores.","opts":["Capital Social – Investimentos – Ações em Tesouraria.","Capital Social – Dividendos Obrigatórios a Pagar – Ajustes de Avaliação Patrimonial.","Reservas de Capital – Reservas de Lucros – Ações em Tesouraria.","Ajustes de Avaliação Patrimonial – Capital Social – Debêntures."],"answer":2,"explanation":"Reservas de capital, reservas de lucros e ações em tesouraria são componentes do patrimônio líquido. As ações em tesouraria aparecem como conta redutora."},{"group":2,"n":10,"source":"FGV — AJ TRT24 / Administrativa / Contabilidade / 2025","stem":"Assinale a opção que indica uma conta de natureza devedora.","opts":["Depreciação acumulada.","Provisão para contingências.","Receita recebida antecipadamente.","Gastos na emissão de valores patrimoniais.","Perdas estimadas com crédito de liquidação duvidosa."],"answer":3,"explanation":"Os gastos na emissão de valores patrimoniais são registrados como conta redutora do patrimônio líquido e possuem natureza devedora."},{"group":3,"n":11,"source":"FGV — TDP (DPE RO) / Técnico em Contabilidade / 2025","stem":"Em 30/11/2024, uma sociedade empresária contraiu um empréstimo de R$ 500.000 com seu único sócio. Foi acordado entre eles que a sociedade empresária pagaria, integralmente, o montante em 30/04/2025.\n\nEm 30/11/2024, o aumento em caixa teve como contrapartida uma conta em:","opts":["Patrimônio líquido.","Passivo circulante.","Passivo não circulante.","Despesas financeiras.","Despesas operacionais."],"answer":1,"explanation":"O empréstimo gera uma obrigação exigível em 30/04/2025. Como será liquidada no curto prazo, a contrapartida do aumento do caixa é o passivo circulante."},{"group":3,"n":12,"source":"FGV — Ana Leg (ALEAM) / Contador / 2025","stem":"Em 31/12/2024, uma sociedade empresária apresentava, em seu Balanço Patrimonial, despesas antecipadas de R$ 24.000 no Ativo Circulante e de R$ 36.000 no Ativo não Circulante. Assinale a opção que indica uma diferença fundamental para definir a classificação da despesa antecipada no Balanço Patrimonial.","opts":["A natureza do gasto.","O prazo de realização.","A moeda de transação.","A materialidade do montante.","A relação com a atividade operacional."],"answer":1,"explanation":"A classificação entre circulante e não circulante depende fundamentalmente do prazo em que o benefício econômico da despesa antecipada será realizado."},{"group":3,"n":13,"source":"FGV — Ana Leg (ALEP) / Contador / 2024","stem":"Uma sociedade empresária desejava adquirir uma máquina para utilizar em suas operações. Deste modo, assinou um contrato, segundo o qual, no ano de 2023, pagaria mensalmente, de janeiro a dezembro, R$ 80.000 ao fornecedor, até receber a máquina, após o pagamento da última prestação.\n\nAssinale a opção que indica a contrapartida da diminuição do caixa nos meses em que a prestação é paga.","opts":["Adiantamentos em ativo circulante.","Conta redutora em passivo circulante.","Adiantamentos em ativo imobilizado.","Conta redutora em passivo não circulante.","Adiantamentos em ativo realizável a longo prazo."],"answer":2,"explanation":"Os pagamentos são adiantamentos vinculados à aquisição de uma máquina destinada ao uso nas operações. Por isso, são classificados no ativo imobilizado."},{"group":3,"n":14,"source":"FGV — Contador (Pref. Caraguatatuba) / 2024","stem":"Uma entidade possui uma conta bancária especial destinada ao pagamento de sua folha salarial. A conta é mantida como medida interna de controle, para facilitar a operação e pode ser movimentada pela entidade por meio de transferências bancárias.\n\nAssinale a opção que indica a classificação dessa conta no balanço patrimonial da entidade.","opts":["Contas a pagar, no passivo circulante.","Disponibilidades, no ativo circulante.","Despesas a pagar, no passivo circulante.","Despesas antecipadas, no ativo circulante.","Aplicações financeiras, no ativo circulante."],"answer":1,"explanation":"Como a conta bancária pode ser livremente movimentada pela entidade, seu saldo integra as disponibilidades no ativo circulante."},{"group":3,"n":15,"source":"FGV — Contador (Pref. Caraguatatuba) / 2024","stem":"Em uma entidade, os passivos podem ser circulantes e não circulantes.\n\nDe acordo com a NBC TG 26 (R5) – Apresentação das Demonstrações Contábeis, assinale a opção que indica um critério para que o passivo seja classificado como não circulante.","opts":["É composto pelos passivos permanentes da entidade.","É mantido essencialmente para a finalidade de ser negociado.","Deve ser liquidado no período de até doze meses após a data do balanço.","Espera-se que seja liquidado em prazo superior ao ciclo operacional normal da entidade.","A entidade não tem direito incondicional de diferir a liquidação do passivo durante pelo menos doze meses após a data do balanço."],"answer":3,"explanation":"O passivo é não circulante quando não atende aos critérios de circulante, como no caso de liquidação esperada em prazo superior ao ciclo operacional normal."},{"group":3,"n":16,"source":"FGV — Contador (Pref. Caraguatatuba) / 2024","stem":"No balanço patrimonial de uma sociedade empresária, o patrimônio líquido representa:","opts":["As obrigações com terceiros.","O valor contábil pertencente aos acionistas ou sócios.","Os ativos que foram integralizados pelos proprietários.","Os bens e os direitos com expectativa de retorno futuro.","A diferença entre as aplicações e as origens de recursos."],"answer":1,"explanation":"O patrimônio líquido é o interesse residual nos ativos depois de deduzidos todos os passivos, representando o valor contábil pertencente aos sócios ou acionistas."},{"group":3,"n":17,"source":"FGV — Aud CE (TCE-PA) / Administrativa / Contabilidade / 2024","stem":"Em relação ao Balanço Patrimonial de uma sociedade empresária, assinale a afirmativa correta.","opts":["A variação da receita e da despesa impactam, diretamente, o ativo.","A soma do passivo circulante e não circulante deve ser igual ao total do patrimônio líquido.","A obtenção de empréstimo bancário implica no aumento do passivo não circulante.","Sempre que o ativo aumenta, há aumento, também, no passivo ou no patrimônio líquido.","Na estrutura de ativo circulante e de passivo circulante há contas com diferentes níveis de liquidez."],"answer":4,"explanation":"As contas do ativo circulante possuem diferentes graus de liquidez e as obrigações do passivo circulante apresentam diferentes prazos de exigibilidade."},{"group":3,"n":18,"source":"FGV — Bacharel (CFC) / 1º Exame de Suficiência / 2024","stem":"Conforme a Lei nº 6.404/76, no Balanço Patrimonial, as contas do ativo são apresentadas de acordo com a ordem decrescente de grau de:","opts":["Liquidez.","Relevância.","Objetividade.","Valor monetário."],"answer":0,"explanation":"A Lei nº 6.404/76 determina que as contas do ativo sejam dispostas em ordem decrescente de grau de liquidez."},{"group":3,"n":19,"source":"FGV — Bacharel (CFC) / 1º Exame de Suficiência / 2024","stem":"Em relação aos ativos, no Balanço Patrimonial de uma entidade, assinale a afirmativa correta, de acordo com a Lei nº 6.404/76 e alterações.","opts":["No intangível estão as participações permanentes em outras sociedades e os direitos de qualquer natureza, não classificáveis no ativo circulante.","No imobilizado estão os direitos que tenham por objeto bens incorpóreos destinados à manutenção da companhia ou exercidos com essa finalidade.","Em investimentos estão os direitos que tenham por objeto bens corpóreos destinados à manutenção das atividades da entidade ou exercidos com essa finalidade.","No circulante estão as disponibilidades, os direitos realizáveis no curso do exercício social subsequente e as aplicações de recursos em despesas do exercício seguinte."],"answer":3,"explanation":"A alternativa reproduz a classificação legal do ativo circulante: disponibilidades, direitos realizáveis no exercício subsequente e despesas do exercício seguinte."},{"group":3,"n":20,"source":"FGV — Ana Prev (MACAEPREV) / Contabilidade / 2024","stem":"Em relação ao balanço patrimonial de uma entidade, representa(m) aplicações de recursos:","opts":["Ativo, apenas.","Passivo, apenas.","Patrimônio líquido, apenas.","Passivo e patrimônio líquido.","Ativo e patrimônio líquido."],"answer":0,"explanation":"O ativo representa as aplicações de recursos. O passivo e o patrimônio líquido representam as origens dos recursos."},{"group":4,"n":1,"source":"","stem":"Desreconhecimento é a retirada de parte ou da totalidade de ativo ou passivo reconhecido do balanço patrimonial da entidade. O desreconhecimento normalmente ocorre quando esse item não atende mais à definição de ativo ou passivo, que expirou, foi consumido, recebido, executado ou transferido. A máquina utilizada para a produção do principal produto de uma determinada entidade deve ser desreconhecida quando","opts":["perder todo o potencial de produzir benefícios econômicos para a entidade.","estiver parcialmente depreciado.","sofrer perda de valor recuperável.","estiver sob controle da entidade"],"answer":0,"explanation":"Desreconhecer é retirar um ativo do balanço. Se a máquina perde definitivamente todo o potencial de produzir benefícios econômicos, deixa de atender à definição de ativo. Depreciação parcial e perda recuperável não implicam necessariamente baixa."},{"group":4,"n":2,"source":"","stem":"Conforme a NBC TG – ESTRUTURA CONCEITUAL, uma Receita reflete aumento nos ativos, ou redução nos passivos, que resultam em aumentos no patrimônio líquido, exceto aqueles referentes a contribuições de detentores de direitos sobre o patrimônio.\n\nAvalie se são reconhecidos como Receita, nesse contexto, os seguintes itens:\n\nI. Ganho de aplicação financeira.\nII. Transferência de estoques a clientes.\nIII. Ganho na venda de imobilizado.\nIV. Entrada de recursos pela emissão/venda de debêntures.\nV. Entrada de recursos pela integralização do capital social.\nVI. Ganho na venda de ações em tesouraria.\n\nSão considerados receitas os itens","opts":["IV, V e VI.","II, III e VI.","I, III e IV.","I, II e III."],"answer":3,"explanation":"I, II e III são receitas: ganho financeiro, receita decorrente da transferência de mercadorias ao cliente e ganho na venda de imobilizado. Debêntures geram obrigação; integralização de capital é aporte dos sócios; transações com ações em tesouraria são reconhecidas no patrimônio líquido."},{"group":4,"n":3,"source":"","stem":"O conceito de Capital é adotado pela maioria das entidades na elaboração das Demonstrações Contábeis. A seleção do conceito apropriado de Capital pela entidade deve ser baseada nas necessidades dos seus usuários, principalmente, os preocupados com a manutenção de capital nominal investido ou com o poder de compra do capital investido. A manutenção do Capital em que o lucro é auferido somente se o montante dos ativos líquidos no final do período exceder o montante dos ativos líquidos no início do período, após excluir quaisquer distribuições para, e contribuições de, sócios durante o período, é a Manutenção do","opts":["Capital Físico.","Capital Financeiro.","Capital Social.","Capital Integralizado."],"answer":1,"explanation":"Na manutenção do capital financeiro, há lucro quando os ativos líquidos finais excedem os iniciais, excluindo contribuições e distribuições aos sócios. Capital físico, diferentemente, refere-se à capacidade operacional."},{"group":4,"n":4,"source":"","stem":"As demonstrações contábeis são normalmente elaboradas com base na suposição de que a entidade que reporta está em continuidade operacional. Desse modo, presume-se que a entidade não tem a intenção e nem a necessidade de","opts":["tornar-se internacional.","modificar a sua atividade-fim.","entrar em liquidação ou deixar de negociar.","expandir os seus negócios para outras localidades."],"answer":2,"explanation":"A continuidade operacional pressupõe que a entidade seguirá operando no futuro previsível, sem intenção ou necessidade de liquidação ou encerramento das atividades."},{"group":4,"n":5,"source":"","stem":"Uma entidade deseja reconhecer um ativo em seu balanço patrimonial. A sua mensuração envolve estimativas que estão sujeitas a incertezas. Nesse caso, a entidade","opts":["não deve reconhecer nem divulgar o ativo, uma vez que não há objetividade em sua mensuração.","deve reconhecer o ativo sem mencionar a existência de estimativas, uma vez que estas foram elaboradas com zelo e são, portanto, confiáveis.","não deve reconhecer o ativo, mas evidenciá-lo em notas explicativas, uma vez que não há espaço para incertezas nas demonstrações contábeis elaboradas.","deve reconhecer o ativo e descrever e explicar as estimativas de forma clara e precisa, uma vez que o uso de estimativas razoáveis é parte essencial da elaboração de informações financeiras."],"answer":3,"explanation":"Estimativas razoáveis são parte essencial dos relatórios financeiros. Incerteza de mensuração não impede automaticamente o reconhecimento; as estimativas e suas incertezas relevantes devem ser explicadas claramente."},{"group":4,"n":6,"source":"","stem":"Em 2023, uma entidade desreconheceu um ativo de seu balanço patrimonial. Assinale a opção que indica uma possível causa para o desreconhecimento.","opts":["A entidade decidiu utilizar um terreno para finalidade diferente.","A entidade perdeu o controle de um imóvel, por meio de decisão judicial.","A entidade renegociou o prazo de recebimento de seus clientes, que estavam em situação financeira difícil.","A entidade constatou que as suas máquinas poderiam ser utilizadas por tempo maior do que a vida útil prevista."],"answer":1,"explanation":"A perda definitiva do controle de um imóvel por decisão judicial pode justificar seu desreconhecimento. Mudança de uso, renegociação de prazo e revisão de vida útil não significam, por si, perda do ativo."},{"group":4,"n":7,"source":"","stem":"De acordo com o conceito de manutenção de capital financeiro, o lucro é auferido somente se o montante financeiro (ou dinheiro) dos ativos líquidos no final do período exceder o montante financeiro (ou dinheiro) dos ativos líquidos no início do período, após excluir","opts":["compra e venda de ativos fixos durante o período.","distribuições para, e contribuições de, sócios durante o período.","reconhecimento contábil de receitas e de despesas durante o período.","recebimento de receitas e pagamentos de despesas durante o período."],"answer":1,"explanation":"Para apurar o lucro pela manutenção do capital financeiro, excluem-se as contribuições dos sócios e as distribuições feitas a eles. Aportes não são receitas e dividendos distribuídos não são despesas."},{"group":4,"n":8,"source":"","stem":"Considerado um fato relevante divulgado por uma empresa de capital aberto, a perspectiva de alto potencial de entrada de benefícios econômicos futuros na aquisição de um novo ativo operacional resultou em um aumento (de R$ 4,50 para R$ 60,50 no valor nominal) de suas ações negociadas em Bolsa de Valores no país e no exterior. Dois meses depois, verificou-se que tal fato relevante era falso e que o acionista majoritário tinha conhecimento disso, o que resultou em prejuízo de bilhões de reais para entidade e foi tratado como crime contra o mercado financeiro. Na divulgação inicial do fato relevante, a característica qualitativa fundamental que deixou de ser observad
