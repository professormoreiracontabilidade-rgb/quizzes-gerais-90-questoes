a pela entidade foi a","opts":["comparabilidade.","prudência.","verificabilidade.","representação fidedigna."],"answer":3,"explanation":"Informação deliberadamente falsa viola a representação fidedigna, característica fundamental que exige representação completa, neutra e isenta de erros. Comparabilidade e verificabilidade são características de melhoria."},{"group":4,"n":9,"source":"","stem":"Um investidor está analisando as demonstrações contábeis de uma sociedade empresária. O investidor tem disponível, para a sua análise, as demonstrações referentes a 31/12/2023, mas não as dos exercícios anteriores. Nesse caso, o investidor não poderá verificar a seguinte característica qualitativa:","opts":["relevância.","tempestividade.","comparabilidade.","compreensibilidade."],"answer":2,"explanation":"Sem demonstrações anteriores, o investidor não consegue comparar a evolução da entidade ao longo do tempo. Comparabilidade permite identificar semelhanças e diferenças entre períodos ou entidades."},{"group":4,"n":10,"source":"","stem":"Leia o fragmento a seguir: *Passivo é a obrigação _____ da entidade de transferir um recurso econômico como resultado de eventos _____*. Assinale a opção cujos itens completam corretamente as lacunas do fragmento acima.","opts":["futura / presente","futura / passados","presente / futuros","presente / passados"],"answer":3,"explanation":"Passivo é obrigação PRESENTE da entidade de transferir recurso econômico como resultado de eventos PASSADOS. O pagamento pode ocorrer no futuro, mas a obrigação já existe."},{"group":4,"n":11,"source":"","stem":"A NBC TG Estrutura Conceitual – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO indica o conceito financeiro e o conceito físico de capital. De acordo com a norma, a seleção do conceito apropriado de capital pela entidade deve ser baseada","opts":["na forma jurídica dos atos e fatos contábeis.","na essência econômica dos atos e fatos contábeis.","nas determinações das entidades reguladoras.","nas necessidades dos usuários de suas demonstrações contábeis"],"answer":3,"explanation":"O conceito de capital deve ser escolhido conforme as necessidades dos usuários das demonstrações contábeis. Capital financeiro refere-se a ativos líquidos em termos monetários; capital físico à capacidade operacional."},{"group":4,"n":12,"source":"","stem":"Um supermercado funciona na região sul do país. Em maio de 2024, devido às fortes chuvas, o supermercado perdeu todo o seu estoque. Nas demonstrações contábeis mensais, em 31/05/24, o supermercado optou por baixar todo o estoque, mesmo sem ter recebido um laudo oficial, de modo a tornar as demonstrações mais úteis aos tomadores de decisões. A informação apresenta a seguinte característica qualitativa:","opts":["neutralidade.","materialidade.","verificabilidade.","tempestividade."],"answer":3,"explanation":"Tempestividade é disponibilizar informação em tempo hábil para influenciar decisões. A perda de estoques foi reconhecida oportunamente, sem esperar um laudo formal, desde que haja evidência adequada."},{"group":4,"n":13,"source":"","stem":"De acordo com a NBC TG Estrutura Conceitual- ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as demonstrações contábeis consolidadas fornecem informações sobre os ativos, passivos, patrimônio líquido, receitas e despesas","opts":["apenas das controladas.","apenas da controladora.","da controladora e de suas controladas, como entidades independentes.","da controladora e de suas controladas, como uma única entidade que reporta."],"answer":3,"explanation":"Demonstrações consolidadas apresentam controladora e controladas como uma única entidade que reporta. Operações e saldos intragrupo exigem ajustes e eliminações."},{"group":4,"n":14,"source":"","stem":"De acordo com a NBC TG Estrutura Conceitual - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, patrimônio líquido é a participação nos ativos da entidade após","opts":["a dedução de seus passivos.","a dedução de suas despesas.","o acréscimo de suas receitas.","o acréscimo de seus passivos."],"answer":0,"explanation":"Patrimônio líquido é a participação residual nos ativos depois da dedução de todos os passivos. Fórmula: PL = Ativo − Passivo."},{"group":4,"n":15,"source":"","stem":"Segundo a NBC TG ESTRUTURA CONCEITUAL, para a representação dos relatórios financeiros ser fidedigna ela precisa ser","opts":["completa, neutra e isenta de erros.","confiável, tempestiva e com erros mínimos.","tempestiva, útil e comparável.","consistente, completa e compreensível."],"answer":0,"explanation":"A representação fidedigna precisa ser COMPLETA, NEUTRA e ISENTA DE ERROS. Isenção de erros não significa que toda estimativa seja perfeitamente exata."},{"group":4,"n":16,"source":"","stem":"De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as características qualitativas fundamentais são relevância e representação fidedigna, sendo que, para ser representação fidedigna, a representação deve ser completa, neutra e isenta de erros. Uma informação neutra pode","opts":["ser parcial.","ser prudente.","possuir inclinações.","ser tendenciosa na seleção de informações financeiras."],"answer":1,"explanation":"A prudência é o exercício de cautela em julgamentos sob incerteza. Ela apoia a neutralidade e não autoriza subavaliar deliberadamente ativos ou superavaliar passivos."},{"group":4,"n":17,"source":"","stem":"De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, para ajudar os usuários das demonstrações contábeis a identificar e avaliar mudanças e tendências, as demonstrações contábeis","opts":["são elaboradas com base na forma jurídica, em detrimento da essência das transações.","restringem a utilização de estimativas a casos em que poderá haver perdas financeiras do usuário.","incluem, apenas, informações que podem ser compreendidas, também, por usuários com pouco conhecimento das atividades comerciais e econômicas, sem auxílio de consultores.","fornecem informações comparativas de, pelo menos, um período de relatório anterior."],"answer":3,"explanation":"Informações comparativas de pelo menos um período anterior ajudam os usuários a identificar mudanças e tendências. A essência econômica prevalece sobre uma descrição meramente formal."},{"group":4,"n":18,"source":"","stem":"Uma sociedade empresária presta serviços de perícia a terceiros. Em junho de 2024, aconteceram os seguintes fatos: \n• Compra de material de escritório para pagamento em 60 dias: R$ 5.000,00; \n• Recebimento antecipado pelos serviços que serão prestados no segundo semestre: R$ 10.000,00; \n• Reconhecimento do salário de seus empregados, para pagamento em 5 de julho: R$ 12.000,00.\n\nEm junho de 2024, o passivo da sociedade empresária aumentou em","opts":["R$ 15.000,00.","R$ 17.000,00.","R$ 22.000,00.","R$ 27.000,00."],"answer":3,"explanation":"Compra a prazo: fornecedores + R$ 5.000. Serviços recebidos antecipadamente: obrigação de prestar serviços + R$ 10.000. Salários apropriados e não pagos: salários a pagar + R$ 12.000. Total: 5.000 + 10.000 + 12.000 = R$ 27.000."},{"group":4,"n":19,"source":"","stem":"De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, com relação às implicações das características qualitativas para a escolha da base de mensuração, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa.\n\n(   ) Utilizar consistentemente as mesmas bases de mensuração para os mesmos itens, seja de período a período, na entidade que reporta ou em um único período para diferentes entidades, prejudica a comparabilidade das demonstrações.\n\n(   ) A mudança na base de mensuração pode tornar as demonstrações contábeis menos compreensíveis. Contudo, a mudança pode ser justificada se outros fatores compensarem a redução na compreensibilidade, por exemplo, se a mudança resulta em informações mais relevantes.\n\n(   ) A verificação é melhorada utilizando-se bases de mensuração que resultam em avaliações que podem ser independentemente corroboradas diretamente, por exemplo, observando os preços, ou indiretamente, por exemplo, verificando dados de entrada de modelo.\n\nAs afirmativas são, respectivamente,","opts":["V – V – V.","V – V – F.","V – F – V.","F – V – V."],"answer":3,"explanation":"1ª FALSA: uso consistente das bases de mensuração favorece, não prejudica, a comparabilidade. 2ª VERDADEIRA: mudança pode reduzir compreensibilidade, mas trazer maior relevância. 3ª VERDADEIRA: verificação direta ou indireta favorece verificabilidade. Sequência F–V–V."},{"group":4,"n":20,"source":"","stem":"De acordo com a NBC TG ESTRUTURA CONCEITUAL (R2) – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO*, *ativo é um recurso econômico presente, controlado pela entidade como resultado de eventos passados. Um recurso econômico representa","opts":["um bem ou um direito que pertence à entidade.","uma obrigação de transferir benefícios econômicos.","um direito que tem o potencial de produzir benefícios econômicos.","uma obrigação que resulta em aumento no patrimônio líquido, exceto quando referente a contribuições de detentores de direitos sobre o patrimônio."],"answer":2,"explanation":"Recurso econômico é um DIREITO que tem potencial de produzir benefícios econômicos. Ativo é recurso econômico presente controlado pela entidade como resultado de eventos passados; propriedade jurídica não é indispensável."},{"group":4,"n":21,"source":"","stem":"Em 2024, uma empresa de varejo estimava inadimplência de 2% sobre o saldo de Clientes. Em 2025, buscando aumentar as vendas, a empresa reduziu as suas exigências para concessão de crédito aos clientes. Assim, uma análise criteriosa indicava que a inadimplência seria muito próxima de 5% nesse ano. No entanto, uma vez que os administradores da empresa são avaliados de acordo com o resultado operacional, eles escolheram continuar utilizando a estimativa anterior, de 2%. Ao avaliar se a informação contábil pode ser considerada representação fidedigna, é correto concluir que","opts":["pode ser, uma vez que é comparável.","pode ser, uma vez que é tempestiva.","não pode ser, uma vez que não é neutra.","não pode ser, uma vez que não é verificável."],"answer":2,"explanation":"A estimativa fundamentada passou de 2% para 5%, mas gestores mantiveram 2% para favorecer o resultado. Essa escolha é tendenciosa e viola a neutralidade. Ex.: saldo de clientes R$ 1.000.000 → diferença de perdas esperadas de R$ 30.000."},{"group":4,"n":22,"source":"","stem":"Em janeiro de 2026, uma entidade fabril assinou um contrato para a compra de uma máquina por R$ 50.000,00. O montante foi pago integralmente em fevereiro. A máquina foi recebida em março, quando foi instalada e disponibilizada para uso. No entanto, por decisão da entidade, a máquina começou a ser efetivamente utilizada em abril. No Balanço Patrimonial da entidade, a máquina deve ser reconhecida a partir de","opts":["janeiro.","fevereiro.","março.","abril."],"answer":2,"explanation":"Janeiro: contrato. Fevereiro: pagamento antecipado. Março: máquina recebida, instalada e disponível para uso. Abril: uso efetivo. O reconhecimento da máquina no imobilizado ocorre em março. A depreciação também começa quando disponível para uso, não quando efetivamente utilizada."},{"group":4,"n":23,"source":"","stem":"Em março de 2026, uma sociedade empresária publicou as suas demonstrações contábeis referentes a 31/12/2025. De acordo com a NBC TG ESTRUTURA CONCEITUAL – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as demonstrações contábeis são elaboradas para um período de tempo específico (período de relatório), para ajudar os usuários a identificar e avaliar mudanças e tendências e também","opts":["calculam os principais indicadores de análise contábil.","apresentam projeções para, pelo menos, o exercício seguinte.","reproduzem as normas contábeis relacionadas a cada ponto apresentado.","fornecem informações comparativas de, pelo menos, um período de relatório anterior."],"answer":3,"explanation":"As demonstrações de 2025 fornecem informações comparativas de pelo menos um período anterior, permitindo identificar mudanças e tendências. Não há obrigação geral de projetar o próximo ano ou calcular todos os indicadores."},{"group":4,"n":24,"source":"","stem":"Com base nos conceitos de ativos, passivos, receitas e despesas e dos critérios necessários para reconhecimento apresentados na NBC TG ESTRUTURA CONCEITUAL, assinale a afirmativa correta.","opts":["A receita deve ser reconhecida quando o cliente realiza o pedido para a realização de um determinado serviço, com contrapartida em Contas a Receber de Clientes.","A distribuição de dividendos deve ser reconhecida como despesa financeira no resultado, em contrapartida ao passivo ou caixa.","O aumento de capital gera o reconhecimento de receitas em contrapartida ao registro em caixa.","O custo das mercadorias vendidas deve ser reconhecido quando ocorre a transferência de controle das mercadorias ao cliente, com a baixa dos estoques no ativo."],"answer":3,"explanation":"O custo das mercadorias vendidas é reconhecido com a transferência do controle das mercadorias ao cliente, com baixa do estoque. Ex.: venda R$ 15.000, custo R$ 9.000 → D CMV 9.000 / C Estoques 9.000; lucro bruto R$ 6.000. Pedido isolado não gera receita; dividendos e aporte de capital não são despesas ou receitas."},{"group":4,"n":25,"source":"","stem":"Uma companhia S.A. realizou recentemente sua oferta pública inicial de ações (IPO) e passou a negociar seus papéis em Bolsa de Valores. Em uma reunião do conselho de administração, o diretor de relações com investidores destacou a importância do relatório financeiro para fins gerais, afirmando que ele deve atender às necessidades informacionais dos diversos usuários externos da companhia. Durante a reunião, foram apresentadas algumas afirmações sobre o objetivo do relatório financeiro para fins gerais. Considerando-se os preceitos da NBC TG ESTRUTURA CONCEITUAL, é correto afirmar que","opts":["o relatório financeiro para fins gerais destina-se a apresentar o valor de mercado da entidade que reporta.","a administração da companhia depende das informações do relatório financeiro para fins gerais para basear suas decisões estratégicas.","o relatório financeiro para fins gerais fornece todas as informações de que necessitam investidores, credores por empréstimos e administradores da companhia para a tomada de decisões.","o objetivo do relatório financeiro para fins gerais é fornecer informações úteis a investidores, credores por empréstimos e outros credores, existentes e potenciais, para decisões sobre o fornecimento de recursos à entidade."],"answer":3,"explanation":"O relatório financeiro para fins gerais fornece informações úteis a investidores, credores por empréstimos e outros credores, atuais e potenciais, para decisões sobre fornecimento de recursos. Não pretende calcular o valor de mercado nem oferecer todas as informações possíveis."},{"group":4,"n":26,"source":"","stem":"Relacione os conceitos de bases de mensuração do valor atual previstos na NBC TG ESTRUTURA CONCEITUAL para relatório financeiro, apresentados na primeira coluna, com seus respectivos significados, descritos na segunda coluna. \n1. Valor Justo \n2. Valor em uso \n3. Custo corrente \n4. Valor de cumprimento \n( ) É o preço que seria recebido pela venda de ativo ou que seria pago pela transferência de passivo em transação ordenada entre participantes do mercado na data de mensuração. \n( ) É o valor presente do caixa, ou de outros recursos econômicos, que a entidade espera ser obrigada a transferir para cumprir a obrigação. \n( ) É o valor presente dos fluxos de caixa, ou outros benefícios econômicos, que a entidade espera obter do uso de ativo e de sua alienação final. \n( ) É a contraprestação que seria paga pelo ativo equivalente na data de mensuração mais os custos de transação que seriam incorridos nessa data, ou a contraprestação que seria recebida pelo passivo equivalente na data de mensuração menos os custos de transação que seriam incorridos nessa data. \nA relação correta, na ordem apresentada, é:","opts":["4 – 2 – 3 – 1.","1 – 4 – 2 – 3.","2 – 3 – 1 – 4.","3 – 4 – 2 – 1."],"answer":1,"explanation":"1ª definição = VALOR JUSTO (1): preço de saída em transação ordenada. 2ª = VALOR DE CUMPRIMENTO (4): valor presente para cumprir passivo. 3ª = VALOR EM USO (2): valor presente dos benefícios do ativo. 4ª = CUSTO CORRENTE (3): custo atual de item equivalente. Sequência 1–4–2–3."},{"group":4,"n":27,"source":"","stem":"A NBC TG ESTRUTURA CONCEITUAL estabelece os conceitos dos elementos das demonstrações contábeis. Com base nessa norma, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa.\n\n(   ) Ativo é um recurso econômico presente de propriedade da entidade como resultado de eventos passados.\n\n(   ) Passivo é uma obrigação futura da entidade de transferir um recurso econômico como resultado de eventos passados.\n\n(   ) Receitas são aumentos nos ativos, ou reduções nos passivos, que resultam em aumento no patrimônio líquido, exceto aqueles referentes a contribuições de detentores de direitos sobre o patrimônio.\n\n(   ) Despesas são reduções nos ativos, ou aumentos nos passivos, que resultam em reduções no patrimônio líquido, exceto aqueles referentes a distribuições aos detentores de direitos sobre o patrimônio.\n\nAs afirmativas são, respectivamente,","opts":["F – F – V – V.","F – V – F – V.","V – F – V – F.","V – V – F – F."],"answer":0,"explanation":"1ª FALSA: ativo exige CONTROLE, não necessariamente propriedade. 2ª FALSA: passivo é obrigação PRESENTE, não futura. 3ª VERDADEIRA: receitas aumentam o PL, exceto contribuições de proprietários. 4ª VERDADEIRA: despesas reduzem o PL, exceto distribuições aos proprietários. Sequência F–F–V–V."},{"group":4,"n":28,"source":"","stem":"A NBC TG Estrutura Conceitual apresenta os elementos: \na. Despesa; \nb. Patrimônio Líquido; \nc. Receita.\n\nRelacione-os às definições: \nI. Aumentos nos ativos ou reduções nos passivos que resultam em aumento no patrimônio líquido. \nII. Reduções nos ativos ou aumentos nos passivos que resultam em reduções no patrimônio líquido. \nIII. Participação residual nos ativos após deduzir todos os passivos.\n\nOs elementos a, b e c correspondem, respectivamente, a quais definições?","opts":["II – III – I.","I – III – II.","II – I – III.","I – II – III."],"answer":0,"explanation":"Despesa = definição II: redução de ativos ou aumento de passivos com redução do PL. Patrimônio líquido = definição III: participação residual nos ativos após deduzir passivos. Receita = definição I: aumento de ativos ou redução de passivos com aumento do PL. Sequência II–III–I."},{"group":5,"n":1,"source":"","stem":"De acordo com o CPC 09, a Demonstração do Valor Adicionado (DVA) tem por objetivo evidenciar:","opts":["O lucro líquido obtido pela entidade no período.","A geração de caixa proveniente das atividades operacionais.","A riqueza criada pela entidade e sua distribuição entre os diversos agentes econômicos.","Apenas os tributos pagos pela entidade."],"answer":2,"explanation":"A DVA evidencia a riqueza criada pela entidade em determinado período e como essa riqueza foi distribuída entre empregados, governo, financiadores e proprietários."},{"group":5,"n":2,"source":"","stem":"A elaboração da DVA é obrigatória para:","opts":["Todas as sociedades empresárias.","Todas as empresas tributadas pelo Lucro Real.","As companhias de capital aberto.","Todas as sociedades limitadas."],"answer":2,"explanation":"No Brasil, a DVA é obrigatória para as companhias abertas. Outras entidades podem elaborá-la facultativamente."},{"group":5,"n":3,"source":"","stem":"Na Demonstração do Valor Adicionado, a receita de aluguel de imóveis é classificada como:","opts":["Remuneração de capital de terceiros.","Receita operacional.","Valor Adicionado Recebido em Transferência.","Outras despesas."],"answer":2,"explanation":"A receita de aluguel é riqueza recebida de terceiros e, na estrutura da DVA, integra o Valor Adicionado Recebido em Transferência."},{"group":5,"n":4,"source":"","stem":"Na DVA, a despesa com aluguel deve ser classificada como:","opts":["Pessoal.","Remuneração de Capital de Terceiros.","Valor Adicionado Recebido em Transferência.","Insumos adquiridos de terceiros."],"answer":1,"explanation":"A despesa de aluguel representa remuneração paga pelo uso de capital de terceiros, sendo apresentada na distribuição do valor adicionado."},{"group":5,"n":5,"source":"","stem":"Uma empresa reconheceu receita financeira de R$ 20.000, receita de equivalência patrimonial de R$ 35.000 e receita de aluguel de R$ 15.000. O Valor Adicionado Recebido em Transferência será de:","opts":["R$ 35.000","R$ 50.000","R$ 55.000","R$ 70.000"],"answer":3,"explanation":"Somam-se os três itens: 20.000 + 35.000 + 15.000 = R$ 70.000."},{"group":5,"n":6,"source":"","stem":"Na distribuição do valor adicionado, os salários, férias, décimo terceiro e FGTS são classificados como:","opts":["Insumos adquiridos de terceiros.","Remuneração de Capital Próprio.","Pessoal.","Tributos."],"answer":2,"explanation":"Esses valores representam benefícios destinados aos empregados e integram o grupo Pessoal."},{"group":5,"n":7,"source":"","stem":"Uma empresa possui salários CLT de R$ 900.000 e serviços terceirizados de R$ 100.000. Na DVA, o valor apresentado no grupo Pessoal será de:","opts":["R$ 1.000.000","R$ 900.000","R$ 100.000","Zero."],"answer":1,"explanation":"Somente os empregados próprios integram Pessoal. Os terceirizados são classificados como serviços de terceiros. Logo, R$ 900.000."},{"group":5,"n":8,"source":"","stem":"Qual das alternativas pertence à Distribuição do Valor Adicionado?","opts":["Receita de vendas.","Receita financeira.","Depreciação.","Remuneração de Capitais Próprios."],"answer":3,"explanation":"A remuneração de capitais próprios integra a distribuição da riqueza. As demais pertencem à formação do valor adicionado."},{"group":5,"n":9,"source":"","stem":"A Demonstração do Valor Adicionado é dividida em duas grandes partes:","opts":["Ativo e Passivo.","Receitas e Despesas.","Formação da riqueza e Distribuição da riqueza.","Fluxo Operacional e Fluxo Financeiro."],"answer":2,"explanation":"A primeira parte mostra como a riqueza foi formada; a segunda, como foi distribuída."},{"group":5,"n":10,"source":"","stem":"Uma sociedade apresentou receita de vendas de R$ 600.000 e provisão para créditos de liquidação duvidosa de R$ 20.000. O valor apresentado no item Receitas da DVA será:","opts":["R$ 620.000","R$ 600.000","R$ 580.000","R$ 560.000"],"answer":2,"explanation":"A PCLD reduz as receitas na DVA: 600.000 − 20.000 = R$ 580.000."},{"group":6,"n":1,"source":"","stem":"Em relação à Demonstração do Valor Adicionado, assinale a alternativa correta.","opts":["A DVA evidencia a riqueza criada pela entidade e a forma como ela foi distribuída.","A DVA demonstra apenas os lucros distribuídos aos acionistas.","A DVA substitui a Demonstração do Resultado do Exercício.","A DVA apresenta exclusivamente informações financeiras."],"answer":0,"explanation":"A finalidade central da DVA é evidenciar a criação e a distribuição da riqueza."},{"group":6,"n":2,"source":"","stem":"Na Demonstração do Valor Adicionado, os juros pagos sobre empréstimos bancários são classificados como:","opts":["Pessoal.","Remuneração de Capital de Terceiros.","Valor Adicionado Recebido em Transferência.","Insumos adquiridos de terceiros."],"answer":1,"explanation":"Juros pagos remuneram recursos de terceiros e integram a distribuição do valor adicionado."},{"group":6,"n":3,"source":"","stem":"Uma companhia apresentou receita financeira de R$ 18.000, receita de equivalência patrimonial de R$ 22.000 e receita de aluguel de R$ 10.000. O Valor Adicionado Recebido em Transferência corresponde a:","opts":["R$ 22.000","R$ 28.000","R$ 50.000","R$ 40.000"],"answer":2,"explanation":"18.000 + 22.000 + 10.000 = R$ 50.000."},{"group":6,"n":4,"source":"","stem":"De acordo com o CPC 09, a depreciação é apresentada na DVA:","opts":["Como remuneração de capital próprio.","Como remuneração de capital de terceiros.","Como distribuição ao governo.","Como redução do Valor Adicionado Bruto para obtenção do Valor Adicionado Líquido."],"answer":3,"explanation":"A depreciação, amortização e exaustão são deduzidas do valor adicionado bruto para apuração do valor adicionado líquido produzido pela entidade."},{"group":6,"n":5,"source":"","stem":"Em relação aos empregados terceirizados, assinale a alternativa correta.","opts":["Seus pagamentos integram o grupo Pessoal.","São classificados como remuneração de capital próprio.","São considerados insumos adquiridos de terceiros.","São classificados como tributos."],"answer":2,"explanation":"Serviços prestados por terceiros são insumos adquiridos de terceiros, não gastos com pessoal próprio."},{"group":6,"n":6,"source":"","stem":"Na distribuição do Valor Adicionado, os dividendos pagos aos acionistas são classificados como:","opts":["Remuneração de Capitais Próprios.","Pessoal.","Tributos.","Valor Adicionado Recebido em Transferência."],"answer":0,"explanation":"Dividendos remuneram os proprietários da entidade e integram a remuneração de capitais próprios."},{"group":6,"n":7,"source":"","stem":"Uma companhia apresentou receita de vendas de R$ 900.000 e provisão para créditos de liquidação duvidosa de R$ 40.000. O valor a ser apresentado no grupo Receitas da DVA será:","opts":["R$ 820.000","R$ 860.000","R$ 900.000","R$ 940.000"],"answer":1,"explanation":"900.000 − 40.000 = R$ 860.000."},{"group":6,"n":8,"source":"","stem":"Compõe o grupo Remuneração de Capital Próprio da DVA:","opts":["Juros sobre empréstimos.","Aluguéis pagos.","Dividendos distribuídos.","Serviços de terceiros."],"answer":2,"explanation":"Dividendos distribuídos aos acionistas representam remuneração do capital próprio."},{"group":6,"n":9,"source":"","stem":"São componentes da primeira parte da DVA, exceto:","opts":["Receitas.","Insumos adquiridos de terceiros.","Valor Adicionado Recebido em Transferência.","Remuneração de Capitais Próprios."],"answer":3,"explanation":"A remuneração de capitais próprios pertence à segunda parte, que trata da distribuição do valor adicionado."},{"group":6,"n":10,"source":"","stem":"Uma sociedade apresentou receita financeira de R$ 12.000, receita de aluguel de R$ 18.000 e receita de equivalência patrimonial de R$ 20.000. Na DVA, o Valor Adicionado Recebido em Transferência será:","opts":["R$ 32.000","R$ 30.000","R$ 38.000","R$ 50.000"],"answer":3,"explanation":"12.000 + 18.000 + 20.000 = R$ 50.000."},{"group":7,"n":1,"source":"FGV - Inv Pol (PC AM)/PC AM/4ª Classe/2022","stem":"Uma entidade adquiriu um terreno por R$ 200.000. A entidade ainda não determinou como irá utilizar o terreno. Em seu balanço patrimonial, o terreno deve ser contabilizado como","opts":["ativo circulante.","ativo imobilizado.","ativo intangível.","propriedade para Investimento.","ativo realizável a longo prazo."],"answer":3,"explanation":"Terreno com uso ainda indeterminado é considerado mantido para valorização do capital (CPC 28, item 8)."},{"group":7,"n":2,"source":"FGV - Cont (CM Aracaju)/CM Aracaju/2021","stem":"Conceitualmente, propriedade para investimento se refere à uma propriedade (terreno ou edificação – ou parte da edificação – ou ambos) mantida pela entidade para auferir receitas de aluguel ou para valorização do capital, ou para ambas. No Balanço Patrimonial, esse item deve ser apresentado no subgrupo:","opts":["ativo imobilizado;","ativo realizável a longo prazo;","ajustes de avaliação patrimonial;","investimentos;","outros resultados abrangentes."],"answer":3,"explanation":"Propriedades para investimento são apresentadas no Ativo Não Circulante, subgrupo Investimentos."},{"group":7,"n":3,"source":"FGV - Ana Leg (ALERO)/ALERO/Contabilidade/2018","stem":"Uma entidade comprou um terreno ao lado de uma obra do metrô, com o intuito de valorização. Assinale a opção que indica a correta classificação do terreno no balanço patrimonial da entidade.","opts":["Ativo realizável a longo prazo.","Ativo não circulante mantido para venda.","Propriedade para investimento.","Ativo imobilizado.","Ativo intangível."],"answer":2,"explanation":"Terreno adquirido para valorização do capital é propriedade para investimento."},{"group":7,"n":4,"source":"FGV - AFCTE (Sefaz AM)/SEFAZ AM/2022","stem":"Uma sociedade empresária que presta serviços de auditoria possui um terreno que é mantido para valorização de capital a longo prazo. Em relação à mensuração do terreno no balanço patrimonial da sociedade empresária, ela deve","opts":["usar o método do custo.","usar o método do valor justo.","usar o método do custo de reposição","escolher entre o método do valor justo e o método do custo.","escolher entre o método do valor justo e o método do valor presente."],"answer":3,"explanation":"Após o reconhecimento inicial, a entidade escolhe como política contábil o modelo do custo ou do valor justo."},{"group":7,"n":5,"source":"FGV - ACE (TCE TO)/TCE TO/Ciências Contábeis/2022","stem":"Uma empresa decidiu alugar um edifício que possui numa área nobre de uma cidade. Também espera que o edifício se valorize ao longo do tempo. Nesse caso, após o reconhecimento do edifício como propriedade para investimento, a empresa pode escolher como sua política contábil o método do:","opts":["valor justo, e os futuros ganhos de valorização do edifício, se ocorrerem, deverão ser contabilizados no resultado do período em que ocorrerem;","custo, e os futuros ganhos de valorização do edifício, se ocorrerem, deverão ser contabilizados em outros resultados abrangentes no patrimônio líquido;","valor justo, e há que se reconhecer, periodicamente, a sua depreciação com base nas regras contábeis aplicáveis ao ativo imobilizado;","valor justo, e os futuros ganhos de valorização do edifício, se ocorrerem, deverão ser contabilizados em outros resultados abrangentes no patrimônio líquido;","custo, e os futuros ganhos de valorização do edifício, se ocorrerem, deverão ser contabilizados no resultado do período em que ocorrerem."],"answer":0,"explanation":"No modelo do valor justo, as alterações no valor justo são reconhecidas no resultado do período."},{"group":7,"n":6,"source":"FGV - FR (Pref RJ)/Pref RJ/2023","stem":"Uma empresa de estacionamento aluga vagas específicas no seu terreno. Todas as vagas do estacionamento são alugadas por meio de um contrato padrão. Pelo contrato, o cliente obtém o direito exclusivo de estacionar em uma vaga específica durante todo o período do contrato. A empresa não pode alterar o espaço designado ao cliente. A vaga no estacionamento atribuída é identificada por um número pintado no chão e os custos de manutenção não são significativos. Nesse caso, considerando-se as informações apresentadas, o estacionamento deve ser contabilizado como:","opts":["imobilizado;","propriedade para investimento;","estoque;","ativo circulante mantido para venda;","intangível."],"answer":1,"explanation":"Vagas identificadas e cedidas com direito exclusivo, com serviços de manutenção insignificantes, caracterizam propriedade para investimento."},{"group":7,"n":7,"source":"FGV - Sup (IMBEL)/IMBEL/Contador/2021","stem":"Em 31/12/X0, uma empresa apresentava, em seu Balanço Patrimonial, um edifício. O prédio estava desocupado, mas era mantido pela empresa para ser arrendado no futuro, em um arrendamento operacional. Assinale a opção que indica a classificação correta do edifício no Balanço Patrimonial.","opts":["Ativo imobilizado.","Patrimônio líquido.","Ativo realizável a longo prazo.","Propriedade para investimento.","Ativo não circulante mantido para venda."],"answer":3,"explanation":"Edifício vazio mantido para futura locação operacional continua classificado como propriedade para investimento."},{"group":7,"n":8,"source":"FGV - Cons TE (SEFAZ ES)/SEFAZ ES/Ciências Contábeis/2022","stem":"Uma sociedade empresária que administra propriedades possui 20 casas em um condomínio. Cada casa tem valor contábil de R$ 400.000. Em 31/12/X0, as casas eram utilizadas do seguinte modo: • onze estavam destinadas à locação a terceiros. • quatro estavam em reforma para futura locação. • três eram alugadas por valores mais baixos aos funcionários e suas famílias. • duas eram utilizadas para a atividade operacional da sociedade empresária. Assinale a opção que indica a contabilização das casas no ativo da sociedade empresária em seu balanço patrimonial, em 31/12/X0.","opts":["R$ 1,6 milhão em propriedade para investimentos e R$ 6,4 milhões em ativo imobilizado.","R$ 6 milhões em propriedade para investimentos e R$ 2 milhões em ativo imobilizado.","R$ 7,2 milhões em propriedade para investimentos e R$ 800 mil em ativo imobilizado.","R$ 8 milhões em investimentos.","R$ 8 milhões em ativo imobilizado."],"answer":1,"explanation":"Conforme o gabarito do material: 15 casas como propriedade para investimento (11 locadas e 4 em reforma para locação) e 5 no imobilizado: R$ 6 milhões e R$ 2 milhões."},{"group":7,"n":9,"source":"FGV - AJ TRT13/TRT 13/Administrativa/Contabilidade/2022","stem":"Uma sociedade empresária tinha como atividade fim a prestação de serviços de educação. Ela possuía um prédio de 10 andares, que funcionava do seguinte modo: ∙Andares 1 a 5: prestação de serviços ∙Andares 6 e 7: aluguel para que terceiros prestem serviços ∙Andares 8: aluguel para que seus funcionários originados de outras cidades residam ∙Andares 9 a 10: aluguel para que terceiros residam Cada andar do prédio era avaliado por R$2 milhões. Assinale a opção que indica a contabilização relacionada ao prédio no balanço patrimonial da sociedade empresária:","opts":["Ativo Realizável a Longo Prazo- R$2 milhões; Investimentos- R$4 milhões e Ativo Imobilizado- R$14 milhões.","Ativo Realizável a Longo Prazo- R$4 milhões; Investimentos- R$6 milhões e Ativo Imobilizado- R$10 milhões.","Investimentos- R$6 milhões e Ativo Imobilizado- R$14 milhões.","Investimentos- R$8 milhões e Ativo Imobilizado- R$12 milhões.","Investimentos- R$10 milhões e Ativo Imobilizado- R$10 milhões."],"answer":3,"explanation":"Segundo o gabarito do material, 4 andares locados a terceiros são investimentos (R$ 8 milhões) e 6 andares são imobilizado (R$ 12 milhões)."},{"group":7,"n":10,"source":"FGV - AFRE MG/SEF MG/Auditoria e Fiscalização/2023","stem":"Uma instituição de ensino adquiriu, em 01/01/X0, um prédio para alugar a terceiros por R$500.000. A vida útil do prédio foi estimada em 50 anos. Após o reconhecimento inicial, a instituição de ensino escolheu mensurar o prédio pelo método do valor justo, com acréscimo reconhecido anualmente na Demonstração do Resultado. Na data, este era de R$600.000. Em 31/12/X1, a instituição decidiu que iria utilizar o prédio em seus negócios, passando a contabiliza- lo como ativo imobilizado. Na data, o valor justo do prédio era de R$700.000. Assinale a opção que indica o valor contábil do prédio no balanço patrimonial da instituição de ensino, em 31/12/X1.","opts":["R$480.000.","R$500.000.","R$576.000.","R$600.000.","R$700.000."],"answer":4,"explanation":"Na transferência da propriedade para investimento mensurada pelo valor justo para imobilizado, o valor justo na data da mudança de uso é o custo considerado: R$ 700.000."},{"group":7,"n":11,"source":"FGV - ATRFB/SRFB/Geral/2023","stem":"Uma entidade tinha seu modelo de negócios estruturado para a venda de terrenos. Em 01/01/X0, o seu estoque era de R$270.000, tendo a seguinte composição: • Terreno A: R$120.000 • Terreno B: R$150.000. Em 31/01/X0, teve início um processo de melhorias na região onde os terrenos estão localizados. Por isso, a entidade decidiu retirar os terrenos de venda e mantê-los para valorização de capital a longo prazo, definindo mensurá-los pelo valor justo. Na data, o valor justo do Terreno A era de R$160.000 e o do Terreno B, de R$140.000. Assinale a opção que indica o efeito da mudança da intenção da administração nas demonstrações contábeis da entidade.","opts":["Demonstração do Resultado do Exercício: +R$30.000.","Demonstração das Mutações do Patrimônio Líquido: +R$30.000.","Demonstração de Outros Resultados Abrangentes: +R$30.000.","Demonstração do Resultado do Exercício: +R$40.000; Demonstração das Mutações do Patrimônio Líquido: –R$10.000.","Demonstração das Mutações do Patrimônio Líquido: +R$40.000; Demonstração do Resultado do Exercício: –R$10.000."],"answer":0,"explanation":"Na transferência de estoque para propriedade para investimento a valor justo, a diferença total é reconhecida no resultado: (160.000−120.000)+(140.000−150.000)=R$ 30.000."},{"group":7,"n":12,"source":"FGV - Cons Leg (ALERO)/ALERO/Assessoramento em Orçamentos/2018","stem":"Em 02/01/2017, uma entidade adquiriu dois terrenos, um por R$100.000 e outro por R$120.000. Os terrenos foram contabilizados como Propriedade para Investimento, uma vez que foram inicialmente mantidos para valorização do capital, e mensurados pelo valor justo, que era respectivamente de R$160.000 e de R$200.000. Em 31/12/2017, o valor justo de cada terreno era de R$180.000 e R$210.000. Com o intuito de utilizar o primeiro terreno em seus negócios e de colocar o segundo a venda, a entidade passou a contabiliza-los como propriedade ocupada pelo proprietário e como estoque. Assinale a opção que indica o valor de cada terreno no ativo da entidade, em 31/12/2017, após a transferência.","opts":["R$100.000 e R$120.000.","R$160.000 e R$200.000.","R$180.000 e R$210.000.","R$100.000 e R$210.000.","R$180.000 e R$120.000."],"answer":2,"explanation":"Na transferência de propriedade para investimento a valor justo para imobilizado ou estoque, o valor justo na data da mudança de uso torna-se o custo considerado: R$ 180.000 e R$ 210.000."},{"group":7,"n":13,"source":"FGV - ATRFB/SRFB/Geral/2023","stem":"Uma sociedade empresária apresentava os seguintes ativos em seu Balanço Patrimonial, em 31/12/X0: • Caixa: R$200.000; • Terreno mantido para futuro uso correntemente indeterminado: R$70.000; • Edifício arrendado para terceiros sob arrendamento operacional: R$120.000; • Edifício desocupado, mantido para ser arrendado para terceiros sob arrendamento operacional: R$140.000; • Propriedade em construção para futura utilização como propriedade para investimento: R$150.000. Assinale a opção que indica o saldo da conta Propriedade para Investimento no Balanço Patrimonial da sociedade empresária na data.","opts":["R$150.000.","R$220.000.","R$260.000.","R$410.000.","R$480.000."],"answer":4,"explanation":"Somam-se os quatro imóveis elegíveis: R$ 70.000 + R$ 120.000 + R$ 140.000 + R$ 150.000 = R$ 480.000."},{"group":7,"n":14,"source":"FGV - AL (CAM DEP)/CAM DEP/Contador/2023","stem":"A Cia. Bela tem como atividade exclusiva a venda de roupas. Ela possuía uma loja própria em um shopping, onde mantinha as suas atividades. Em 31/12/2021, a Cia. Bela adquiriu uma nova loja por R$100.000, para pagamento em 3 anos. Caso o pagamento tivesse sido à vista, o valor pago seria de R$80.000. No momento da compra, esta loja foi alugada a terceiros. Após o reconhecimento inicial, a Cia. Bela optou por mensurar a nova loja ao valor justo, que era de R$120.000. Em 31/12/2022, o valor justo da loja era de R$130.000. Na data, a sociedade empresária decidiu utilizar esta loja também para a venda de roupas, ampliando os seus negócios. Na data, a sociedade empresária estimava utilizar a loja por 25 anos. Assinale a opção que indica o valor da loja no balanço patrimonial da Cia. Bela em 01/01/2023.","opts":["R$130.000.","R$124.000.","R$120.000.","R$100.000.","R$80.000."],"answer":0,"explanation":"Ao passar a utilizar a loja em suas operações, o valor justo na data da transferência (R$ 130.000) passa a ser seu custo considerado."},{"group":7,"n":15,"source":"FGV - Aud (MPE AL)/MPE AL/2018","stem":"Uma entidade possuía, em 31/12/2016, dois terrenos, que estavam contabilizados em seu ativo imobilizado, por R$ 600.000 e R$ 850.000. Em 2017 a entidade transferiu os dois terrenos para a conta Propriedade para Investimento, pois a intenção passou a ser valorização do capital. Na data da transferência, o valor justo de cada um dos terrenos era de R$ 700.000. Assinale a opção que indica o efeito da contrapartida do reconhecimento do valor justo dos dois terrenos.","opts":["Diminuição de R$ 50.000 em ajustes de avaliação patrimonial.","Aumento de R$ 50.000 em resultado do exercício.","Diminuição de R$ 50.000 em resultado do exercício.","Aumento de R$ 100.000 em ajustes de avaliação patrimonial e diminuição de R$ 150.000 no resultado do exercício.","Diminuição de R$ 150.000 em ajustes de avaliação patrimonial e aumento de R$ 100.000 no resultado do exercício."],"answer":3,"explanation":"Na transferência do imobilizado para propriedade para investimento a valor justo: ganho de R$ 100.000 em AAP e perda de R$ 150.000 no resultado."},{"group":7,"n":16,"source":"FGV - Ana MP (MPE GO)/MPE GO/Analista Contábil/2022","stem":"Uma sociedade empresária possuía um imóvel que alugava a outra pessoa jurídica. Nesse imóvel funcionava uma escola. A sociedade empresária prestava serviços de apoio à escola, sendo responsável pela administração, definição do material didático, orientação pedagógica e alimentação. Assinale a opção que indica a contabilização do imóvel no balanço patrimonial da sociedade empresária, considerando as características da negociação.","opts":["Ativo circulante.","Ativo realizável a longo prazo.","Propriedade para investimento.","Ativo Imobilizado.","Patrimônio Líquido."],"answer":3,"explanation":"Os serviços de apoio à escola são significativos; o imóvel é tratado como imobilizado, não como propriedade para investimento."},{"group":7,"n":17,"source":"FGV - ES (SEMSA Manaus)/Pref Manaus/Contador/2022","stem":"Uma sociedade empresária que presta serviços de consultoria adquiriu, em 01/01/X0, por R$800.000, um prédio para ser usado em seus negócios. A sociedade empresária tinha a intenção de utilizar o prédio durante 40 anos e não considerava valor residual. Em 31/12/X1, a direção da sociedade empresária encerrou as atividades no prédio, transferindo sua sede para outro bairro, de modo que o prédio original foi alugado a terceiros. O prédio passou a ser avaliado a valor justo que, na data, era de R$880.000. Assinale a opção que indica a contabilização da contrapartida da parte remanescente decorrente do reconhecimento do valor justo do prédio nas demonstrações contábeis da sociedade empresária em 31/12/X1.","opts":["Reserva de Capital no Balanço Patrimonial.","Ajustes de Avaliação Patrimonial no Balanço Patrimonial.","Resultado Operacional na Demonstração do Resultado do Exercício.","Resultado Financeiro na Demonstração do Resultado do Exercício.","Outros Resultados Abrangentes em Demonstração do Resultado Abrangente."],"answer":1,"explanation":"Na mudança de imobilizado para propriedade para investimento a valor justo, o aumento acima do valor contábil é reconhecido em ajustes de avaliação patrimonial, observadas as regras de reavaliação."},{"group":7,"n":18,"source":"FGV - AL (SEN)/SEN/Contabilidade/2022","stem":"Uma instituição de ensino adquiriu dois terrenos, para serem utilizados para aluguel a terceiros, por R$80.000 e por R$100.000 respectivamente. Os terrenos são mensurados a valor justo, com efeito nas Demonstrações Contábeis. No ano seguinte, avaliou-se que cada terreno tinha valor justo de R$90.000. O ganho e a perda proveniente da alteração no valor justo dos terrenos devem ser apresentados, respectivamente, na(s) seguinte(s) demonstração(ões) contábil(eis):","opts":["Demonstração do Resultado do Exercício e Demonstração do Resultado do Exercício.","Demonstrações das Mutações do Patrimônio Líquido e Demonstrações das Mutações do Patrimônio Líquido.","Demonstração dos Resultados Abrangentes e Demonstração dos Resultados Abrangentes.","Demonstração do Resultado do Exercício e Demonstração dos Resultados Abrangentes.","Demonstrações das Mutações do Patrimônio Líquido e Demonstração do Resultado do Exercício."],"answer":0,"explanation":"Ganhos e perdas posteriores na mensuração a valor justo de propriedades para investimento são reconhecidos na DRE."},{"group":7,"n":19,"source":"FGV - Sup (IMBEL)/IMBEL/Contador/2021","stem":"Em 01/01/X0, uma entidade adquiriu, por R$ 120.000, um terreno para valorização de capital a longo prazo, para pagamento em 120 dias. O preço do terreno à vista era de R$ 100.000. Assinale a opção que indica o efeito no Balanço Patrimonial na data da aquisição, admitindo que ele é relevante.","opts":["Aumento no Ativo Circulante: R$ 20.000.","Aumento no Passivo Circulante: R$ 20.000.","Aumento no Passivo Circulante: R$ 120.000.","Aumento no Ativo Imobilizado: R$ 100.000.","Aumento no Ativo Imobilizado: R$ 120.000."],"answer":3,"explanation":"O preço à vista do terreno é R$ 100.000, mas a obrigação de pagamento em 120 dias é de R$ 120.000; o gabarito destaca o aumento do passivo circulante em R$ 120.000."},{"group":7,"n":20,"source":"FGV - TT (SEFIN RO)/SEFIN RO/2018","stem":"Uma sociedade empresária possuía, em 31/12/2016, dois terrenos, um destinado à venda e outro ao uso. O primeiro estava contabilizado por R$ 100.000 no Ativo Circulante como estoque. Já o segundo, estava contabilizado por R$ 100.000 no Ativo Imobilizado. Com o objetivo de valorização do capital, em 2017, a sociedade empresária transferiu os dois terrenos para a conta Propriedade para Investimento, passando a contabilizá-los pelo valor justo, que era de R$ 120.00 e de R$ 180.000. Assinale a opção que indica os lançamentos corretos feitos pela sociedade empresária no momento da transferência dos terrenos.","opts":["D - Propriedade para investimento: R$ 120.000; C - Ativo Circulante: R$ 100.000; C - Receita: R$ 20.000; D - Propriedade para investimento: R$ 180.000; C - Ativo Imobilizado: R$ 100.000; C - Ajuste de Avaliação Patrimonial: R$ 80.000.","D - Propriedade para investimento: R$ 120.000; C - Ativo Circulante: R$ 100.000; C - Receita: R$ 20.000; D - Propriedade para investimento: R$ 180.000; C - Ativo Imobilizado: R$ 100.000; C - Receita: R$ 80.000.","D - Propriedade para investimento: R$ 120.000; C - Ativo Circulante: R$ 100.000; C - Ajuste de Avaliação Patrimonial: R$ 20.000; D - Propriedade para investimento: R$ 180.000; C - Ativo Imobilizado: R$ 100.000; C - Ajuste de Avaliação Patrimonial: R$ 80.000.","D - Propriedade para investimento: R$ 120.000; C - Ativo Circulante: R$ 100.000; C - Ajuste de Avaliação Patrimonial: R$ 20.000; D - Propriedade para investimento: R$ 180.000; C - Ativo Imobilizado: R$ 100.000; C - Receita: R$ 80.000.","D - Propriedade para investimento: R$ 120.000; C - Ativo Circulante: R$ 100.000; C - Ganho: R$ 20.000; D - Propriedade para investimento: R$ 180.000; C - Ativo Imobilizado: R$ 100.000; C - Ganho: R$ 80.000."],"answer":0,"explanation":"Estoque transferido para PPI: diferença positiva de R$ 20.000 no resultado. Imobilizado transferido para PPI: aumento de R$ 80.000 em ajustes de avaliação patrimonial."},{"group":8,"n":1,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"O objetivo dos relatórios financeiros para fins gerais é:","opts":["Determinar a decisão que o investidor deve tomar.","Fornecer informações financeiras úteis sobre a entidade que reporta.","Apresentar exclusivamente dados fiscais.","Atender apenas à administração."],"answer":1,"explanation":"Os relatórios fornecem informações úteis sobre a entidade que reporta. A contabilidade auxilia, mas não toma a decisão pelo usuário."},{"group":8,"n":2,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"São usuários primários da informação contábil:","opts":["Clientes, empregados e governo.","Administradores e auditores internos.","Investidores, credores por empréstimos e outros credores, existentes e potenciais.","Somente os acionistas atuais."],"answer":2,"explanation":"A Estrutura Conceitual identifica como usuários primários os investidores, credores por empréstimos e outros credores, existentes e potenciais."},{"group":8,"n":3,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"A administração não é considerada usuário primário porque:","opts":["Não utiliza informações contábeis.","Pode obter internamente as informações de que necessita.","Não participa da gestão da entidade.","É proibida de acessar demonstrações financeiras."],"answer":1,"explanation":"A administração possui acesso direto às informações internas e pode solicitar relatórios específicos."},{"group":8,"n":4,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"Uma decisão típica apoiada pelos relatórios financeiros é:","opts":["Escolher a cor da marca da empresa.","Definir a escala de férias dos empregados.","Comprar, vender ou manter um investimento.","Escolher o fornecedor de material de escritório."],"answer":2,"explanation":"Os relatórios apoiam decisões sobre fornecimento de recursos, como comprar, vender ou manter instrumentos patrimoniais."},{"group":8,"n":5,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"Relatórios financeiros para fins gerais:","opts":["São personalizados para cada investidor.","Atendem a um conjunto amplo de usuários.","Devem eliminar informações complexas.","Apresentam diretamente o valor de mercado da empresa."],"answer":1,"explanation":"Eles são elaborados para fins gerais e não para atender exclusivamente a um usuário específico."},{"group":8,"n":6,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"Sobre o valor da entidade, é correto afirmar que os relatórios financeiros:","opts":["Estabelecem exatamente o valor de mercado.","Substituem qualquer avaliação econômica.","Auxiliam os usuários a estimar esse valor.","Apresentam apenas o valor da marca."],"answer":2,"explanation":"Os relatórios não estabelecem o valor da entidade, mas fornecem informações que ajudam em sua estimativa."},{"group":8,"n":7,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"A entidade que reporta pode ser:","opts":["Somente uma pessoa jurídica isolada.","Uma única entidade, parte dela ou conjunto de entidades.","Apenas uma sociedade anônima.","Somente uma controladora."],"answer":1,"explanation":"A entidade que reporta pode abranger uma entidade, parte dela ou mais de uma entidade."},{"group":8,"n":8,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"As demonstrações contábeis são elaboradas do ponto de vista:","opts":["Do investidor majoritário.","Do credor bancário.","Da entidade que reporta como um todo.","Da administração exclusivamente."],"answer":2,"explanation":"O ponto de vista é o da entidade que reporta, não o de um grupo específico de usuários."},{"group":8,"n":9,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"Os relatórios financeiros para fins gerais:","opts":["Fornecem todas as informações necessárias aos usuários.","Dispensam análise econômica e setorial.","Podem precisar ser complementados por informações de outras fontes.","Eliminam a necessidade de julgamento do usuário."],"answer":2,"explanation":"Usuários também consideram economia, política, setor, concorrência e outras fontes."},{"group":8,"n":10,"source":"CPC 00 — Objetivos, Usuários e Relatórios","stem":"Quem toma a decisão final com base na informação contábil?","opts":["O contador.","A auditoria externa.","O usuário da informação.","O órgão regulador."],"answer":2,"explanation":"A contabilidade fornece a informação; quem decide é o usuário."},{"group":9,"n":1,"source":"CPC 00 — Relevância e Materialidade","stem":"A informação é relevante quando:","opts":["É obrigatoriamente inédita.","É capaz de fazer diferença nas decisões dos usuários.","É sempre utilizada pelo usuário.","É apresentada apenas em valores monetários."],"answer":1,"explanation":"Relevância depende da capacidade de influenciar decisões, não do uso efetivo nem do ineditismo."},{"group":9,"n":2,"source":"CPC 00 — Relevância e Materialidade","stem":"A informação continua relevante quando o usuário:","opts":["Decide não utilizá-la.","Já a conhece por outra fonte.","Ambas as situações anteriores.","Nunca toma decisões."],"answer":2,"explanation":"Ela pode continuar relevante mesmo se não for usada ou se já for conhecida por outra fonte."},{"group":9,"n":3,"source":"CPC 00 — Relevância e Materialidade","stem":"Valor preditivo significa que a informação:","opts":["Confirma exclusivamente fatos passados.","Ajuda o usuário a prever resultados futuros.","É uma previsão pronta produzida pela contabilidade.","Elimina qualquer incerteza."],"answer":1,"explanation":"Valor preditivo permite ao usuário utilizar a informação em seus próprios processos de previsão."},{"group":9,"n":4,"source":"CPC 00 — Relevância e Materialidade","stem":"Valor confirmatório ocorre quando a informação:","opts":["Ajuda a confirmar ou alterar avaliações anteriores.","Substitui estimativas futuras.","É irrelevante para decisões.","Não admite revisão."],"answer":0,"explanation":"O valor confirmatório fornece feedback sobre avaliações feitas anteriormente."},{"group":9,"n":5,"source":"CPC 00 — Relevância e Materialidade","stem":"Uma mesma informação pode possuir:","opts":["Somente valor preditivo.","Somente valor confirmatório.","Valor preditivo e confirmatório ao mesmo tempo.","Nenhum dos dois valores e ainda ser relevante."],"answer":2,"explanation":"A mesma informação pode confirmar avaliações passadas e ajudar a prever resultados futuros."},{"group":9,"n":6,"source":"CPC 00 — Relevância e Materialidade","stem":"A materialidade é:","opts":["Característica qualitativa fundamental independente.","Característica qualitativa de melhoria.","Aspecto da relevância específico da entidade.","Sinônimo de tempestividade."],"answer":2,"explanation":"Materialidade é um aspecto da relevância analisado no contexto específico da entidade."},{"group":9,"n":7,"source":"CPC 00 — Relevância e Materialidade","stem":"Uma informação é material quando sua omissão, distorção ou obscuridade:","opts":["Não produz qualquer efeito.","Pode influenciar razoavelmente decisões dos usuários primários.","Afeta apenas o contador.","Sempre supera um limite fixo."],"answer":1,"explanation":"A materialidade considera se a informação pode influenciar razoavelmente decisões."},{"group":9,"n":8,"source":"CPC 00 — Relevância e Materialidade","stem":"Na avaliação da materialidade, consideram-se:","opts":["Apenas valores monetários.","Somente a natureza do item.","Natureza, magnitude ou ambas.","Somente a opinião do auditor."],"answer":2,"explanation":"A materialidade depende da natureza, da magnitude ou de ambas."},{"group":9,"n":9,"source":"CPC 00 — Relevância e Materialidade","stem":"Sobre limite quantitativo para materialidade:","opts":["Existe um valor único para todas as empresas.","É definido exclusivamente por lei.","Não se pode estabelecer limite uniforme para todas as situações.","Todo valor pequeno é imaterial."],"answer":2,"explanation":"Não existe um limite quantitativo uniforme aplicável a todas as entidades e situações."},{"group":9,"n":10,"source":"CPC 00 — Relevância e Materialidade","stem":"Uma fraude de pequeno valor pode ser material porque:","opts":["Pequenos valores são sempre materiais.","A natureza do fato pode influenciar decisões.","A magnitude nunca importa.","Fraudes não precisam ser divulgadas."],"answer":1,"explanation":"Mesmo com pequeno valor, a natureza da fraude pode revelar falhas relevantes de governança."},{"group":10,"n":1,"source":"CPC 03 — DFC: Fundamentos","stem":"A Demonstração dos Fluxos de Caixa tem como objetivo principal evidenciar:","opts":["Apenas o lucro líquido do exercício.","As entradas e saídas de caixa e equivalentes de caixa.","Somente as alterações no patrimônio líquido.","Exclusivamente os investimentos realizados."],"answer":1,"explanation":"A DFC evidencia as entradas e saídas de caixa e equivalentes de caixa, classificadas em atividades operacionais, de investimento e de financiamento."},{"group":10,"n":2,"source":"CPC 03 — DFC: Fundamentos","stem":"Os fluxos de caixa decorrentes das atividades principais geradoras de receita da entidade são classificados como:","opts":["Operacionais.","De investimento.","De financiamento.","Patrimoniais."],"answer":0,"explanation":"Atividades operacionais são as principais atividades geradoras de receita da entidade e outras que não sejam de investimento ou financiamento."},{"group":10,"n":3,"source":"CPC 03 — DFC: Fundamentos","stem":"A compra à vista de mercadorias para revenda representa:","opts":["Entrada operacional.","Saída operacional.","Saída de investimento.","Saída de financiamento."],"answer":1,"explanation":"A compra de estoques integra o ciclo operacional e gera saída de caixa operacional."},{"group":10,"n":4,"source":"CPC 03 — DFC: Fundamentos","stem":"A aquisição à vista de uma máquina para uso na produção é classificada como:","opts":["Atividade operacional.","Atividade de investimento.","Atividade de financiamento.","Atividade sem efeito na DFC."],"answer":1,"explanation":"A máquina é ativo imobilizado. A aquisição de ativos de longo prazo gera fluxo de investimento."},{"group":10,"n":5,"source":"CPC 03 — DFC: Fundamentos","stem":"A obtenção de empréstimo bancário em dinheiro representa:","opts":["Entrada operacional.","Entrada de investimento.","Entrada de financiamento.","Receita operacional."],"answer":2,"explanation":"A obtenção de empréstimos altera o capital de terceiros e é entrada de financiamento."},{"group":10,"n":6,"source":"CPC 03 — DFC: Fundamentos","stem":"O pagamento do principal de um empréstimo bancário é classificado como:","opts":["Saída operacional.","Saída de investimento.","Saída de financiamento.","Despesa sem efeito caixa."],"answer":2,"explanation":"A amortização do principal reduz o capital de terceiros e é fluxo de financiamento."},{"group":10,"n":7,"source":"CPC 03 — DFC: Fundamentos","stem":"A venda à vista de um equipamento usado do imobilizado gera:","opts":["Entrada operacional.","Entrada de investimento.","Entrada de financiamento.","Nenhum fluxo de caixa."],"answer":1,"explanation":"A alienação de imobilizado gera entrada de caixa nas atividades de investimento."},{"group":10,"n":8,"source":"CPC 03 — DFC: Fundamentos","stem":"Qual item não integra caixa e equivalentes de caixa?","opts":["Dinheiro em espécie.","Depósito bancário disponível.","Aplicação de curtíssimo prazo com alta liquidez.","Duplicata a receber de cliente."],"answer":3,"explanation":"Duplicatas a receber são direitos, mas não são caixa nem equivalentes de caixa."},{"group":10,"n":9,"source":"CPC 03 — DFC: Fundamentos","stem":"O pagamento de salários dos empregados é classificado como:","opts":["Atividade operacional.","Atividade de investimento.","Atividade de financiamento.","Transação não monetária."],"answer":0,"explanation":"Salários são gastos ligados às operações normais da entidade."},{"group":10,"n":10,"source":"CPC 03 — DFC: Fundamentos","stem":"A integralização de capital social em dinheiro representa:","opts":["Entrada operacional.","Entrada de investimento.","Entrada de financiamento.","Receita de vendas."],"answer":2,"explanation":"A entrada de recursos dos sócios altera o capital próprio e é atividade de financiamento."},{"group":11,"n":1,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"Uma empresa recebeu R$ 500.000 de clientes e pagou R$ 320.000 a fornecedores. O fluxo operacional líquido foi:","opts":["R$ 180.000.","R$ 320.000.","R$ 500.000.","R$ 820.000."],"answer":0,"explanation":"Fluxo operacional líquido = 500.000 − 320.000 = R$ 180.000."},{"group":11,"n":2,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"O pagamento antecipado de aluguel da sede administrativa é classificado como:","opts":["Saída operacional.","Saída de investimento.","Saída de financiamento.","Sem efeito na DFC."],"answer":0,"explanation":"Mesmo sendo contabilizado inicialmente como despesa antecipada, o desembolso está ligado às operações da entidade."},{"group":11,"n":3,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"Uma prestadora de serviços recebeu R$ 800.000 de clientes, pagou R$ 240.000 de salários e R$ 270.000 de despesas diversas. O fluxo operacional líquido foi:","opts":["R$ 290.000.","R$ 310.000.","R$ 530.000.","R$ 800.000."],"answer":0,"explanation":"800.000 − 240.000 − 270.000 = R$ 290.000."},{"group":11,"n":4,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"O recebimento de uma venda realizada a prazo em exercício anterior é:","opts":["Entrada operacional.","Entrada de investimento.","Entrada de financiamento.","Receita sem caixa."],"answer":0,"explanation":"Na DFC, considera-se o momento do recebimento. Recebimentos de clientes são operacionais."},{"group":11,"n":5,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"Uma empresa comercial comprou estoque por R$ 90.000 e vendeu-o, recebendo R$ 120.000. A variação operacional líquida foi:","opts":["R$ 30.000.","R$ 90.000.","R$ 120.000.","R$ 210.000."],"answer":0,"explanation":"120.000 − 90.000 = R$ 30.000 de geração operacional líquida."},{"group":11,"n":6,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"O pagamento de tributos sobre o lucro, em regra, é classificado como:","opts":["Operacional.","Investimento.","Financiamento.","Patrimonial."],"answer":0,"explanation":"Em regra, tributos sobre o lucro são operacionais, salvo quando puderem ser especificamente identificados com investimento ou financiamento."},{"group":11,"n":7,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"O pagamento à vista de energia elétrica utilizada na loja representa:","opts":["Saída operacional.","Saída de investimento.","Saída de financiamento.","Transação sem caixa."],"answer":0,"explanation":"Energia elétrica é despesa ligada à operação normal da empresa."},{"group":11,"n":8,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"O recebimento de comissão por intermediação de vendas é:","opts":["Entrada operacional.","Entrada de investimento.","Entrada de financiamento.","Ajuste contábil sem caixa."],"answer":0,"explanation":"Comissões recebidas ligadas à atividade da entidade são fluxos operacionais."},{"group":11,"n":9,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"Uma empresa recebeu R$ 350.000 de clientes, pagou R$ 140.000 a fornecedores, R$ 80.000 de salários e R$ 20.000 de tributos. O fluxo operacional líquido foi:","opts":["R$ 110.000.","R$ 130.000.","R$ 210.000.","R$ 350.000."],"answer":0,"explanation":"350.000 − 140.000 − 80.000 − 20.000 = R$ 110.000."},{"group":11,"n":10,"source":"CPC 03 — DFC: Atividades Operacionais","stem":"A compra à vista de material de escritório para consumo imediato é:","opts":["Saída operacional.","Saída de investimento.","Saída de financiamento.","Sem efeito no caixa."],"answer":0,"explanation":"Material de consumo utilizado nas operações gera saída operacional."},{"group":12,"n":1,"source":"CPC 16 — Estoques • Mensuração de estoques","stem":"De acordo com o CPC 16, os estoques devem ser mensurados:","opts":["pelo maior valor entre custo e valor justo.","pelo menor valor entre custo e valor realizável líquido.","sempre pelo preço de venda.","sempre pelo custo histórico corrigido.","pelo valor de reposição."],"answer":1,"explanation":"A regra central do CPC 16 é mensurar os estoques pelo menor valor entre o custo e o valor realizável líquido."},{"group":12,"n":2,"source":"CPC 16 — Estoques • Valor realizável líquido","stem":"O valor realizável líquido corresponde:","opts":["ao preço de compra deduzido dos tributos recuperáveis.","ao preço de venda estimado menos os custos para conclusão e os gastos necessários para vender.","ao valor justo acrescido da margem de lucro.","ao custo histórico atualizado pelo índice de inflação.","ao valor de mercado sem qualquer dedução."],"answer":1,"explanation":"VRL = preço de venda estimado menos custos para conclusão e gastos necessários para vender."},{"group":12,"n":3,"source":"CPC 16 — Estoques • Custo de aquisição","stem":"Integra o custo de aquisição dos estoques:","opts":["frete sobre compras.","frete sobre vendas.","comissão de vendedores.","propaganda institucional.","despesas administrativas gerais."],"answer":0,"explanation":"O frete sobre compras é necessário para trazer o estoque ao local atual e integra o custo."},{"group":12,"n":4,"source":"CPC 16 — Estoques • Tributos recuperáveis","stem":"Na compra de mercadorias para revenda, o ICMS recuperável deve ser:","opts":["incluído no custo do estoque.","registrado como despesa operacional.","registrado como direito no ativo.","registrado como receita financeira.","registrado como patrimônio líquido."],"answer":2,"explanation":"Tributos recuperáveis não integram o custo; são registrados como direitos, como ICMS a recuperar."},{"group":12,"n":5,"source":"CPC 16 — Estoques • Tributos não recuperáveis","stem":"Os tributos não recuperáveis incidentes na aquisição de estoques devem ser:","opts":["deduzidos do custo.","reconhecidos como despesa financeira.","incluídos no custo do estoque.","lançados diretamente no patrimônio líquido.","tratados como receita diferida."],"answer":2,"explanation":"Tributos não recuperáveis junto ao Fisco integram o custo de aquisição."},{"group":12,"n":6,"source":"CPC 16 — Estoques • Desconto comercial","stem":"O desconto comercial obtido na compra de mercadorias deve ser tratado como:","opts":["receita financeira.","redução do custo do estoque.","despesa comercial.","passivo circulante.","ajuste de avaliação patrimonial."],"answer":1,"explanation":"Descontos comerciais e abatimentos são deduzidos do custo de aquisição."},{"group":12,"n":7,"source":"CPC 16 — Estoques • Desconto financeiro","stem":"O desconto financeiro obtido pelo pagamento dentro do prazo deve ser tratado, em regra, como:","opts":["redução do custo do estoque.","receita financeira.","custo de transformação.","perda estimada.","despesa antecipada."],"answer":1,"explanation":"Desconto financeiro não altera o custo do estoque; em regra, é receita financeira."},{"gr  const pool=DATA.map((q,i)=>({q,i})).filter(x=>g==='all'||ids.includes(x.q.group)).map(x=>x.i);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 order=pool.slice(0,10);pos=0;answers={};revealed={};ink={};
 if(saved&&Array.isArray(saved.order)&&saved.order.length===10&&saved.order.every(i=>Number.isInteger(i)&&i>=0&&i<DATA.length&&(g==='all'||ids.includes(DATA[i].group)))){
 order=saved.order;pos=Math.max(0,Math.min(10,saved.pos||0));answers=saved.answers||{};revealed=saved.revealed||{};ink=saved.ink||{}
 }
 save();render()
}

function select(a){if(mode==='aluno'&&answers[order[pos]]!==undefined)return;answers[order[pos]]=a;save();render()}
function reveal(){revealed[order[pos]]=!revealed[order[pos]];save();render()}
function move(d){if(group===null)return;if(d>0&&pos===order.length-1)recordScore();pos+=d;if(pos<0){home();return}if(pos>order.length)pos=order.length;tool='off';save();render()}
function restart(){if(group===null){render();return}if(!confirm('Reiniciar este desafio e apagar o progresso?'))return;localStorage.removeItem(storageKey());choose(group)}
function setTool(t){tool=t;render()}
function clearInk(){if(group===null||pos<0||pos>=order.length)return;delete ink[order[pos]];save();render()}
function render(){const app=$('app');$('homeBtn').disabled=group===null;$('back').disabled=group===null;$('next').disabled=group===null||pos===order.length;
if(group===null){app.innerHTML=`<h1 class="heading">🎡 QUIZ CONTÁBIL — MODO ALUNO</h1><div class="subtitle">10 questões por assunto • 8 tópicos • Gabarito comentado</div><div class="menu">${TOPICS.map((t,i)=>`<button class="tile" onclick="choose(${i})">${esc(t.label)}${scoreBadge(i)}</button>`).join('')}<button class="tile all" onclick="choose('all')">🎲 DESAFIO GERAL${scoreBadge('all')}</button></div><p class="subtitle">A cada nova rodada, são sorteadas 10 questões do banco de 218. O progresso da rodada é salvo neste navegador. Para sortear outras questões, use Reiniciar.</p>`;return}

if(pos===order.length){let correct=order.filter(i=>answers[i]===DATA[i].answer).length,wrong=order.filter(i=>answers[i]!==undefined&&answers[i]!==DATA[i].answer).length,unanswered=order.length-correct-wrong;app.innerHTML=`<div class="panel"><h1 class="heading">🏆 RESULTADO FINAL</h1><div class="score">${correct} acertos • ${wrong} erros</div><div class="score">${Math.round(correct/order.length*100)}% de aproveitamento</div><p class="subtitle" style="color:#4d237b">🏅 Melhor resultado: ${Math.max(correct,scoreInfo(group)?.best??0)} de ${order.length} • ${correct>=7?'Muito bem!':'Continue praticando!'}</p><p class="subtitle" style="color:#4d237b">${unanswered} sem resposta • ${order.length} questões no total</p><button class="mainbtn" onclick="home()">ESCOLHER OUTRO ASSUNTO</button></div>`;return}
const id=order[pos],q=DATA[id],chosen=answers[id],show=mode==='professor'?!!revealed[id]:chosen!==undefined;
app.innerHTML=`<div class="qhead" style="color:white"><span>${esc(group==='all'?'🎲 DESAFIO GERAL':TOPICS[group].label)}</span><span>QUESTÃO ${pos+1} / ${order.length}</span></div>${mode==='professor'?`<div class="toolbar"><button class="${tool==='off'?'active':''}" onclick="setTool('off')">☝️ NAVEGAR</button><button class="${tool==='pen'?'active':''}" onclick="setTool('pen')">✏️ CANETA</button><button class="${tool==='yellow'?'active':''}" onclick="setTool('yellow')">🟨 MARCA-TEXTO</button><button class="${tool==='green'?'active':''}" onclick="setTool('green')">🟩 MARCA-TEXTO</button><button class="${tool==='eraser'?'active':''}" onclick="setTool('eraser')">BORRACHA</button><input type="color" value="${color}" onchange="color=this.value" aria-label="Cor da caneta"><label>Espessura <input type="range" min="2" max="26" value="${width}" oninput="width=+this.value"></label><button onclick="clearInk()">LIMPAR</button></div>`:''}<div class="panel drawarea ${tool!=='off'?'drawing':''}" id="surface"><div class="qhead"><span>Questão ${q.n}</span><span>${esc(mode==='aluno'?'MODO ALUNO':'MODO PROFESSOR')}</span></div>${q.source?`<div class="source">${esc(q.source)}</div>`:''}<div class="stem">${text(q.stem)}</div><div class="choices">${q.opts.map((o,i)=>`<button class="choice ${chosen===i?'selected':''} ${show&&i===q.answer?'correct':''} ${show&&chosen===i&&i!==q.answer?'wrong':''}" onclick="select(${i})"><b>${'ABCDE'[i]||i+1}</b><span>${text(o)}</span></button>`).join('')}</div>${mode==='professor'?`<div style="margin-top:18px"><button class="mainbtn" onclick="reveal()">${show?'OCULTAR GABARITO':'👁️ MOSTRAR GABARITO'}</button></div>`:''}${show?`<div class="feedback" style="color:${chosen===q.answer?'#087b3c':'#c00047'}">${mode==='aluno'?(chosen===q.answer?'🟢 VOCÊ ACERTOU!':'🔴 VOCÊ ERROU!'):'✅ GABARITO: '+('ABCDE'[q.answer]||'?')}</div><div class="explanation"><strong>📖 RESOLUÇÃO COMENTADA</strong><div>${text(q.explanation)}</div></div>`:''}${mode==='professor'?'<canvas id="board"></canvas>':''}</div>`;
if(mode==='professor')setupCanvas(id);
}
function setupCanvas(id){let canvas=$('board'),area=$('surface');canvas.width=area.clientWidth*devicePixelRatio;canvas.height=area.clientHeight*devicePixelRatio;let ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);let strokes=ink[id]||[];function paint(){ctx.clearRect(0,0,area.clientWidth,area.clientHeight);for(let s of strokes){ctx.beginPath();ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=s.a;for(let j=0;j<s.p.length;j++){let [x,y]=s.p[j];if(j===0)ctx.moveTo(x*area.clientWidth,y*area.clientHeight);else ctx.lineTo(x*area.clientWidth,y*area.clientHeight)}if(s.p.length===1){let [x,y]=s.p[0];ctx.lineTo(x*area.clientWidth+.1,y*area.clientHeight+.1)}ctx.stroke()}ctx.globalAlpha=1}paint();function xy(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}canvas.onpointerdown=e=>{if(tool==='off')return;canvas.setPointerCapture(e.pointerId);drawing=true;let c=tool==='yellow'?'#ffde00':tool==='green'?'#00c853':tool==='eraser'?'#ffffff':color;strokes.push({c,w:tool==='pen'?width:tool==='eraser'?35:22,a:tool==='pen'||tool==='eraser'?1:.35,p:[xy(e)]});paint()};canvas.onpointermove=e=>{if(!drawing)return;strokes[strokes.length-1].p.push(xy(e));paint()};canvas.onpointerup=()=>{drawing=false;ink[id]=strokes;save()};canvas.onpointercancel=canvas.onpointerup}
render();
</script></body></html>
